<title>Dinero</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e6b52'/%3E%3Ctext x='32' y='45' font-size='38' font-family='Georgia,serif' font-weight='700' text-anchor='middle' fill='%23fff'%3E%24%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #f4f3ee;
  --surface: #ffffff;
  --surface-2: #f8f8f5;
  --ink: #1b2420;
  --muted: #5f6b65;
  --line: #e1e0d8;
  --accent: #1e6b52;
  --accent-ink: #ffffff;
  --accent-soft: #e2efe9;
  --in: #1c7a4d;
  --out: #1b2420;
  --neg: #b3261e;
  --warn: #8a5300;
  --warn-soft: #fbefd9;
  --bad: #b3261e;
  --bad-soft: #fbe3e1;
  --ok-soft: #e0f1e7;
  --info-soft: #e5ecf6;
  --info: #2c5282;
  --shadow: 0 1px 2px rgba(20, 30, 25, .06), 0 2px 8px rgba(20, 30, 25, .05);
  --radius: 12px;
  --tap: 44px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111513; --surface: #1a201d; --surface-2: #202724; --ink: #e6ebe8; --muted: #9aa69f; --line: #2d3531;
    --accent: #4fb88e; --accent-ink: #0d1411; --accent-soft: #1f3a2f; --in: #5cc795; --out: #e6ebe8; --neg: #ff8a80;
    --warn: #f0b45a; --warn-soft: #3a2d17; --bad: #ff8a80; --bad-soft: #3d1f1d; --ok-soft: #1c3428; --info-soft: #1d2a3b; --info: #9cc0f0;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111513; --surface: #1a201d; --surface-2: #202724; --ink: #e6ebe8; --muted: #9aa69f; --line: #2d3531;
  --accent: #4fb88e; --accent-ink: #0d1411; --accent-soft: #1f3a2f; --in: #5cc795; --out: #e6ebe8; --neg: #ff8a80;
  --warn: #f0b45a; --warn-soft: #3a2d17; --bad: #ff8a80; --bad-soft: #3d1f1d; --ok-soft: #1c3428; --info-soft: #1d2a3b; --info: #9cc0f0;
  --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overflow-x: hidden;
}
h1, h2, h3 { margin: 0; line-height: 1.2; }
h1 { font-size: 1.5rem; letter-spacing: -.01em; }
h2 { font-size: 1.12rem; }
h3 { font-size: 1rem; }
p { margin: .4em 0; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.money, .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.neg { color: var(--neg); }
.in { color: var(--in); }
.hidden { display: none !important; }

/* ---------- Top bar & tabs ---------- */
.app { max-width: 1240px; margin: 0 auto; min-height: 100vh; }
.topbar {
  position: sticky; top: 0; z-index: 20; background: var(--bg);
  border-bottom: 1px solid var(--line); padding: env(safe-area-inset-top) 16px 0;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 12px 0 6px; width: fit-content; }
.logo {
  width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font: 700 19px/1 Georgia, "Times New Roman", serif;
}
.brand-name { font: 700 1.3rem/1 Georgia, "Times New Roman", serif; letter-spacing: .01em; }
.tabs {
  display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  margin: 0 -16px; padding: 4px 16px 0;
}
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  flex: 0 0 auto; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600; font-size: .92rem;
  padding: 10px 12px 12px; min-height: var(--tap); border-bottom: 3px solid transparent; cursor: pointer; position: relative;
}
.tabs button[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
.tabs button .dot { position: absolute; top: 9px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
@media (min-width: 900px) {
  .topbar { display: flex; align-items: flex-end; gap: 24px; }
  .brand { padding: 14px 0 14px; }
  .tabs { margin: 0; padding: 0; flex-wrap: wrap; }
}

main { padding: 18px 16px calc(40px + env(safe-area-inset-bottom)); outline: none; }
.loading { color: var(--muted); }
.banner { margin: 10px 16px 0; padding: 10px 14px; border-radius: 10px; background: var(--bad-soft); color: var(--bad); font-weight: 600; }

/* ---------- Page header & toolbars ---------- */
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.page-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.section { margin-top: 26px; }
.section > .page-head { margin-bottom: 10px; }
.toolbar { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; margin-bottom: 12px; }
.toolbar .wide { grid-column: 1 / -1; }
@media (min-width: 900px) {
  .toolbar { grid-template-columns: 1.2fr 1.2fr .8fr 2fr auto; align-items: end; }
  .toolbar .wide { grid-column: auto; }
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--tap);
  padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.danger-ghost { color: var(--bad); border-color: var(--bad-soft); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding: 0 8px; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: .88rem; border-radius: 8px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, .tabs button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .chip:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 1px;
}
.icon-btn {
  width: var(--tap); height: var(--tap); display: inline-grid; place-items: center; border: 0; border-radius: 10px;
  background: transparent; color: var(--muted); font-size: 1.15rem; cursor: pointer;
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.card + .card { margin-top: 12px; }
.empty { text-align: center; padding: 34px 20px; }
.empty .btn { margin: 12px 0 6px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.acct-card { display: flex; flex-direction: column; gap: 4px; }
.acct-card .acct-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.acct-card .big { font-size: 1.7rem; font-weight: 700; letter-spacing: -.01em; margin-top: 6px; }
.acct-card.total { background: var(--accent-soft); border-color: transparent; }
.acct-card .btn { align-self: flex-start; margin-top: 6px; margin-left: -8px; }
dl.mini { display: flex; gap: 22px; margin: 8px 0 0; }
dl.mini dt { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
dl.mini dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }

.stats { display: grid; gap: 10px; grid-template-columns: repeat(2, 1fr); margin-bottom: 14px; }
@media (min-width: 700px) { .stats { grid-template-columns: repeat(4, 1fr); } .stats.three { grid-template-columns: repeat(3, 1fr); } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; text-align: left; font: inherit; color: inherit; }
button.stat { cursor: pointer; min-height: var(--tap); }
button.stat[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.stat .label { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.stat .value { font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .sub { font-size: .82rem; color: var(--muted); }
.stat.bad .value { color: var(--bad); }

/* ---------- Coming due ---------- */
.due-list { list-style: none; margin: 0; padding: 0; }
.due-list li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.due-list li:first-child { border-top: 0; }
.due-list .when { width: 92px; flex: 0 0 auto; font-size: .85rem; color: var(--muted); }
.due-list .what { flex: 1 1 140px; min-width: 0; }
.alert-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left;
  background: var(--bad-soft); color: var(--bad); border: 0; border-radius: 10px; padding: 12px 14px; font: inherit; font-weight: 600; cursor: pointer; margin-bottom: 10px; min-height: var(--tap);
}
.alert-row.info { background: var(--info-soft); color: var(--info); }

/* ---------- Pills & chips ---------- */
.pill { display: inline-block; font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; vertical-align: middle; border: 0; font-family: inherit; line-height: 1.6; }
.pill.ok { background: var(--ok-soft); color: var(--in); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--info-soft); color: var(--info); }
button.pill { cursor: pointer; min-height: 30px; padding: 2px 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 0 14px; min-height: 38px; font: inherit; font-weight: 600; font-size: .9rem; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: inline-flex; align-items: center; justify-content: center; min-height: var(--tap); padding: 0 18px; font-weight: 600; cursor: pointer; }
.seg input:checked + span { background: var(--accent); color: var(--accent-ink); }
.seg input:focus-visible + span { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: -3px; }

/* ---------- Forms ---------- */
label.field, .field { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; font-weight: 600; color: var(--muted); min-width: 0; }
input, select, textarea {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 0 12px; min-height: var(--tap); width: 100%; min-width: 0;
}
input[type="date"] { -webkit-appearance: none; appearance: none; display: block; line-height: var(--tap); }
textarea { padding: 10px 12px; min-height: 70px; resize: vertical; }
select { -webkit-appearance: none; appearance: none; padding-right: 32px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
input[type="checkbox"] { width: auto; min-height: 0; }
.form-grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .form-grid.two { grid-template-columns: 1fr 1fr; } .form-grid .span2 { grid-column: 1 / -1; } }
.toggle { display: flex; align-items: center; gap: 12px; min-height: var(--tap); font-weight: 600; color: var(--ink); cursor: pointer; font-size: .95rem; }
.toggle input { appearance: none; -webkit-appearance: none; width: 48px; height: 28px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; flex: 0 0 auto; border: 0; padding: 0; transition: background .15s; }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.toggle input:checked { background: var(--accent); }
.toggle input:checked::after { transform: translateX(20px); }
.form-error { color: var(--bad); background: var(--bad-soft); border-radius: 8px; padding: 10px 12px; font-weight: 600; }
.form-error:empty { display: none; }
.note { background: var(--info-soft); color: var(--info); border-radius: 10px; padding: 10px 12px; font-size: .9rem; }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.bad { background: var(--bad-soft); color: var(--bad); }
.swap-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; }
.swap-row .icon-btn { border: 1px solid var(--line); background: var(--surface); color: var(--accent); font-size: 1.2rem; }
@media (max-width: 480px) {
  .swap-row { grid-template-columns: 1fr; }
  .swap-row .icon-btn { justify-self: center; transform: rotate(90deg); }
}

/* ---------- Tables ---------- */
.table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
table.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; padding: 10px 10px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: .92rem; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .r { text-align: right; }
.tbl tbody tr[data-act] { cursor: pointer; }
.tbl tbody tr[data-act]:hover td { background: var(--surface-2); }
.tbl tr.opening td { background: var(--surface-2); font-weight: 600; }
.tbl tr.total td { font-weight: 700; background: var(--surface-2); }
.tbl .sub { color: var(--muted); font-size: .82rem; }
.tbl tr.child td:first-child { padding-left: 30px; }
.tbl tr.parent td { font-weight: 700; }
.reg .c-amt, .reg .c-meta { display: none; }
.reg td.c-payee { min-width: 160px; }
.list-foot { padding: 10px 12px; text-align: center; }

@media (max-width: 760px) {
  .reg thead { display: none; }
  .reg tbody tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "payee amt" "meta meta" "bal status"; column-gap: 10px; padding: 11px 12px; border-bottom: 1px solid var(--line); }
  .reg tbody tr:last-child { border-bottom: 0; }
  .reg td { padding: 0; border: 0; font-size: .92rem; }
  .reg td.c-date, .reg td.c-acct, .reg td.c-cat, .reg td.c-chk, .reg td.c-in, .reg td.c-out, .reg td.c-clr { display: none; }
  .reg td.c-payee { grid-area: payee; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
  .reg td.c-amt { display: block; grid-area: amt; text-align: right; font-weight: 700; }
  .reg td.c-meta { display: block; grid-area: meta; color: var(--muted); font-size: .82rem; margin-top: 2px; overflow-wrap: anywhere; }
  .reg td.c-bal { grid-area: bal; text-align: left !important; font-size: .82rem; color: var(--muted); margin-top: 6px; align-self: center; }
  .reg td.c-bal .clr-inline { display: inline; }
  .reg td.c-status { grid-area: status; text-align: right; margin-top: 4px; }
  .reg tr.opening { grid-template-areas: "payee amt"; }
  .reg tr.opening td.c-bal, .reg tr.opening td.c-status, .reg tr.opening td.c-meta { display: none; }
  .stats.three { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .stats.three .stat { padding: 10px; }
  .stats.three .value { font-size: 1rem; }
  .stats.three .label { font-size: .7rem; overflow-wrap: anywhere; }
}
.reg .clr-inline { display: none; }

/* Simple list rows (bills, recurring, transfers, categories) */
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.row-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 13px 14px; border-top: 1px solid var(--line); align-items: start; }
.row-item:first-child { border-top: 0; }
.row-item .title { font-weight: 700; overflow-wrap: anywhere; }
.row-item .meta { color: var(--muted); font-size: .86rem; overflow-wrap: anywhere; }
.row-item .amount { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row-item .row-actions { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.row-item.past-due { background: color-mix(in srgb, var(--bad-soft) 55%, transparent); }
.row-item.due-today { background: color-mix(in srgb, var(--warn-soft) 60%, transparent); }
.row-item.child { padding-left: 34px; }
.row-item .pills { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }

/* ---------- Modal ---------- */
.overlay { position: fixed; inset: 0; background: rgba(10, 15, 12, .45); z-index: 400; display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 640px) { .overlay { align-items: center; padding: 24px; } }
.modal {
  background: var(--surface); color: var(--ink); width: 100%; max-width: 560px; max-height: 92vh; display: flex; flex-direction: column;
  border-radius: 16px 16px 0 0; box-shadow: 0 10px 40px rgba(0,0,0,.25);
}
.modal.wide { max-width: 760px; }
@media (min-width: 640px) { .modal { border-radius: 16px; } }
.modal > header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 10px 10px 18px; border-bottom: 1px solid var(--line); }
.modal-body { padding: 16px 18px calc(18px + env(safe-area-inset-bottom)); overflow-y: auto; -webkit-overflow-scrolling: touch; }
.modal .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px; }
.modal .actions .spacer { flex: 1; }
.modal ul.errors { margin: 8px 0; padding-left: 20px; color: var(--bad); max-height: 45vh; overflow: auto; }
.modal ul.errors li { margin: 3px 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: 8px 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- Toasts ---------- */
#toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 500; display: flex; flex-direction: column; gap: 8px; width: min(92vw, 440px); pointer-events: none; }
.toast { background: var(--ink); color: var(--bg); border-radius: 10px; padding: 12px 16px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.25); animation: toastIn .18s ease-out; }
.toast.bad { background: var(--bad); color: #fff; }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- Opening animation ---------- */
body.intro .topbar .brand, body.intro .tabs, body.intro #main { opacity: 0; }
.intro-veil {
  position: fixed; inset: 0; z-index: 300; cursor: pointer;
  background: radial-gradient(circle at 50% 45%, var(--accent-soft) 0%, var(--bg) 62%);
}
.intro-fly {
  position: fixed; z-index: 301; margin: 0; pointer-events: none; transform-origin: 50% 50%;
  will-change: transform, opacity; perspective: 400px;
}
.intro-fly .logo { position: relative; overflow: hidden; box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 40%, transparent); backface-visibility: visible; }
.intro-fly .logo::after {
  content: ""; position: absolute; inset: -40%; transform: translateX(-120%) rotate(25deg);
  background: linear-gradient(90deg, transparent 35%, rgba(255,255,255,.55) 50%, transparent 65%);
  animation: introShine 1.1s .35s ease-in-out both;
}
.intro-fly .brand-name { white-space: nowrap; display: inline-flex; }
.intro-veil { cursor: default; }
.intro-gate {
  position: absolute; left: 50%; transform: translateX(-50%); width: min(340px, calc(100vw - 32px));
  display: flex; flex-direction: column; gap: 10px; text-align: center;
}
.gate-tag { color: var(--muted); margin: 0 0 8px; font-size: .95rem; }
.gate-btn { width: 100%; min-height: 52px; font-size: 1.02rem; border-radius: 14px; }
.gate-btn[data-g="continue"] { flex-direction: column; gap: 0; line-height: 1.25; padding: 8px 16px; }

<script>
// ---- util.js ----
'use strict';
/* ===== General helpers: text, dates, money, CSV ===== */

const APP_VERSION = '1.0.0';

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function pad(n, w = 2) { return String(n).padStart(w, '0'); }
function deepClone(o) { return JSON.parse(JSON.stringify(o)); }
function norm(s) { return String(s ?? '').trim().toLowerCase(); }

/* ---- Dates (always YYYY-MM-DD strings, local calendar days) ---- */
function localDateStr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function today() { return localDateStr(new Date()); }
function daysInMonth(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
function isDate(s) {
  if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const [y, m, d] = s.split('-').map(Number);
  return m >= 1 && m <= 12 && d >= 1 && d <= daysInMonth(y, m);
}
function addDays(s, n) {
  const [y, m, d] = s.split('-').map(Number);
  const t = new Date(Date.UTC(y, m - 1, d + n));
  return t.getUTCFullYear() + '-' + pad(t.getUTCMonth() + 1) + '-' + pad(t.getUTCDate());
}
// Adds months, clamping to the last day of a shorter month (Jan 31 -> Feb 28/29).
function addMonths(s, n) {
  let [y, m, d] = s.split('-').map(Number);
  let mi = (m - 1) + n;
  y += Math.floor(mi / 12);
  mi = ((mi % 12) + 12) % 12;
  return y + '-' + pad(mi + 1) + '-' + pad(Math.min(d, daysInMonth(y, mi + 1)));
}
const FREQUENCIES = ['Weekly', 'Every 2 Weeks', 'Monthly', 'Every 2 Months', 'Quarterly', 'Yearly'];
function advanceDate(s, freq) {
  switch (freq) {
    case 'Weekly': return addDays(s, 7);
    case 'Every 2 Weeks': return addDays(s, 14);
    case 'Monthly': return addMonths(s, 1);
    case 'Every 2 Months': return addMonths(s, 2);
    case 'Quarterly': return addMonths(s, 3);
    case 'Yearly': return addMonths(s, 12);
  }
  throw new Error('Unknown frequency: ' + freq);
}
function monthStart(s) { return s.slice(0, 7) + '-01'; }
function monthEnd(s) { const [y, m] = s.split('-').map(Number); return s.slice(0, 7) + '-' + pad(daysInMonth(y, m)); }
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function fmtDate(s) {
  if (!isDate(s)) return s || '';
  const [y, m, d] = s.split('-').map(Number);
  return `${MONTHS[m - 1]} ${d}, ${y}`;
}
function fmtMonth(ym) { const [y, m] = ym.split('-').map(Number); return `${MONTHS_LONG[m - 1]} ${y}`; }
function fmtDateTime(iso) {
  if (!iso) return 'Never';
  const d = new Date(iso);
  if (isNaN(d)) return 'Never';
  let h = d.getHours(); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
  return `${fmtDate(localDateStr(d))}, ${h}:${pad(d.getMinutes())} ${ap}`;
}
function daysBetween(a, b) { // b - a in days
  const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = b.split('-').map(Number);
  return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 86400000);
}
// Excel serial date (1900 system) -> YYYY-MM-DD
function excelSerialToDate(n) {
  const ms = Math.round((n - 25569) * 86400000);
  const t = new Date(ms);
  return t.getUTCFullYear() + '-' + pad(t.getUTCMonth() + 1) + '-' + pad(t.getUTCDate());
}
// Accepts YYYY-MM-DD, YYYY/MM/DD, M/D/YYYY, Excel serial numbers, Date objects. Returns '' for blank, null if invalid.
function parseAnyDate(v) {
  if (v == null || v === '') return '';
  if (typeof v === 'number') return v > 0 && v < 2958466 ? excelSerialToDate(v) : null;
  if (v instanceof Date) return isNaN(v) ? null : localDateStr(v);
  const s = String(v).trim();
  if (!s) return '';
  let m;
  if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})(?:[ T].*)?$/))) {
    const r = m[1] + '-' + pad(+m[2]) + '-' + pad(+m[3]);
    return isDate(r) ? r : null;
  }
  if ((m = s.match(/^(\d{1,2})[/\-.](\d{1,2})[/\-.](\d{2}|\d{4})$/))) {
    let y = +m[3]; if (y < 100) y += 2000;
    const r = y + '-' + pad(+m[1]) + '-' + pad(+m[2]);
    return isDate(r) ? r : null;
  }
  if (/^\d+(\.\d+)?$/.test(s)) return parseAnyDate(Number(s));
  return null;
}

/* ---- Money: all sums are done in integer cents ---- */
// Parses "1,234.50", "$12", "(5.00)", "-3" -> number, or NaN.
function parseMoney(v) {
  if (typeof v === 'number') return isFinite(v) ? v : NaN;
  let s = String(v ?? '').trim();
  if (!s) return NaN;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  s = s.replace(/[$,\s]/g, '');
  if (s.startsWith('-')) { neg = !neg; s = s.slice(1); }
  if (s.startsWith('+')) s = s.slice(1);
  if (!/^(\d+\.?\d*|\.\d+)$/.test(s)) return NaN;
  const n = parseFloat(s);
  return neg ? -n : n;
}
function toCents(v) {
  const n = typeof v === 'number' ? v : parseMoney(v);
  if (!isFinite(n)) return NaN;
  const sign = n < 0 ? -1 : 1;
  return sign * Math.round(Math.abs(n) * 100 + 1e-7);
}
function centsToNum(c) { return Math.round(c) / 100; } // stored money: plain number, 2 decimals
const MONEY_FMT = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
function fmt(c) { const s = MONEY_FMT.format(Math.round(c) / 100); return s.replace('−', '-'); }
function fmtSigned(c) { return c > 0 ? '+' + fmt(c) : fmt(c); }
function fixed2(c) { return (Math.round(c) / 100).toFixed(2); }

/* ---- CSV ---- */
function csvCell(v) {
  const s = v == null ? '' : String(v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCSV(rows) { return '﻿' + rows.map((r) => r.map(csvCell).join(',')).join('\r\n') + '\r\n'; }

function yesNo(b) { return b ? 'Yes' : 'No'; }
function parseYesNo(v, dflt) {
  if (v === true || v === 1) return true;
  if (v === false || v === 0) return false;
  const s = norm(v);
  if (!s) return dflt;
  if (['yes', 'y', 'true', '1', 'x'].includes(s)) return true;
  if (['no', 'n', 'false', '0'].includes(s)) return false;
  return undefined;
}
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }

// ---- zip.js ----
'use strict';
/* ===== Minimal ZIP writer (stored) and reader (stored + deflate via the browser's DecompressionStream) ===== */

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(u8) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
const UTF8_ENC = new TextEncoder();
const UTF8_DEC = new TextDecoder();

function concatU8(arr) {
  const len = arr.reduce((a, b) => a + b.length, 0);
  const out = new Uint8Array(len);
  let o = 0;
  for (const a of arr) { out.set(a, o); o += a.length; }
  return out;
}

// files: [{name, data: string|Uint8Array}] -> Uint8Array (zip)
function zipFiles(files) {
  const parts = [], central = [];
  let offset = 0;
  const now = new Date();
  const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  for (const f of files) {
    const name = UTF8_ENC.encode(f.name);
    const data = typeof f.data === 'string' ? UTF8_ENC.encode(f.data) : f.data;
    const crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true); lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true); ch.setUint16(12, dosTime, true);
    ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true);
    ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const cdSize = central.reduce((a, b) => a + b.length, 0);
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true); eo.setUint16(8, files.length, true); eo.setUint16(10, files.length, true);
  eo.setUint32(12, cdSize, true); eo.setUint32(16, offset, true);
  return concatU8([...parts, ...central, new Uint8Array(eo.buffer)]);
}

async function inflateRaw(u8) {
  if (typeof DecompressionStream === 'undefined') {
    throw new Error('This browser is too old to open compressed Excel files. Please update Safari or Chrome.');
  }
  const stream = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function unzip(buf) {
  const u8 = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let e = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
  }
  if (e < 0) throw new Error('This file is not an Excel .xlsx workbook (it is not a zip file).');
  const count = dv.getUint16(e + 10, true);
  let p = dv.getUint32(e + 16, true);
  const entries = {};
  for (let k = 0; k < count; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('The workbook file is damaged.');
    const method = dv.getUint16(p + 10, true);
    const csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const lo = dv.getUint32(p + 42, true);
    const name = UTF8_DEC.decode(u8.subarray(p + 46, p + 46 + nlen));
    p += 46 + nlen + xlen + clen;
    const start = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true);
    entries[name] = { method, raw: u8.subarray(start, start + csize) };
  }
  return {
    names: Object.keys(entries),
    async text(name) {
      const key = Object.keys(entries).find((n) => n.toLowerCase() === name.toLowerCase());
      if (!key) return null;
      const f = entries[key];
      let data;
      if (f.method === 0) data = f.raw;
      else if (f.method === 8) data = await inflateRaw(f.raw);
      else throw new Error('The workbook uses a compression type this app cannot read.');
      return UTF8_DEC.decode(data);
    },
  };
}

// ---- xlsx.js ----
'use strict';
/* ===== Minimal .xlsx writer and reader (no external library) ===== */

function xlColName(i) {
  let s = ''; i++;
  while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); }
  return s;
}
function xlColIndex(letters) {
  let n = 0;
  for (const ch of letters.toUpperCase()) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
}
function xmlEsc(s) {
  return String(s)
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F￾￿]/g, '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function xmlUnesc(s) {
  return s
    .replace(/&#x([0-9a-fA-F]+);/g, (_, h) => String.fromCodePoint(parseInt(h, 16)))
    .replace(/&#(\d+);/g, (_, d) => String.fromCodePoint(+d))
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&')
    .replace(/_x([0-9A-Fa-f]{4})_/g, (_, h) => String.fromCharCode(parseInt(h, 16)));
}
function xmlAttrs(s) {
  // Namespace prefixes are dropped, except a prefixed "id" (the relationship id) is kept as "r:id".
  const o = {};
  const put = (k, v) => {
    const i = k.indexOf(':');
    const key = i < 0 ? k : (k.slice(i + 1) === 'id' ? 'r:id' : k.slice(i + 1));
    o[key] = xmlUnesc(v);
  };
  s.replace(/([\w:.-]+)\s*=\s*"([^"]*)"/g, (_, k, v) => put(k, v));
  s.replace(/([\w:.-]+)\s*=\s*'([^']*)'/g, (_, k, v) => put(k, v));
  return o;
}

/*
 * sheets: [{ name, rows: [[cell...]], widths: [chars...], colStyles: ['text'|'money'|null...] }]
 * cell: string | number | null | { f: 'FORMULA', v: number }
 * Row 1 is written bold. Money columns get #,##0.00; text columns get the "@" (text) format so typed dates stay text.
 */
function buildXlsx(sheets) {
  const H = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const RNS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const PNS = 'http://schemas.openxmlformats.org/package/2006/relationships';
  const files = [];
  files.push({ name: '[Content_Types].xml', data: H +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
    sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') +
    '</Types>' });
  files.push({ name: '_rels/.rels', data: H + `<Relationships xmlns="${PNS}"><Relationship Id="rId1" Type="${RNS}/officeDocument" Target="xl/workbook.xml"/></Relationships>` });
  files.push({ name: 'xl/workbook.xml', data: H + `<workbook xmlns="${NS}" xmlns:r="${RNS}"><sheets>` +
    sheets.map((s, i) => `<sheet name="${xmlEsc(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('') +
    '</sheets><calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>' });
  files.push({ name: 'xl/_rels/workbook.xml.rels', data: H + `<Relationships xmlns="${PNS}">` +
    sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="${RNS}/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') +
    `<Relationship Id="rId${sheets.length + 1}" Type="${RNS}/styles" Target="styles.xml"/></Relationships>` });
  // Styles: 0 normal, 1 bold header, 2 money, 3 text
  files.push({ name: 'xl/styles.xml', data: H + `<styleSheet xmlns="${NS}">` +
    '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>' +
    '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>' +
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
    '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +
    '<xf numFmtId="4" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>' +
    '<xf numFmtId="49" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs>' +
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>' });

  sheets.forEach((sh, si) => {
    const styleFor = (ci) => (sh.colStyles && sh.colStyles[ci] === 'money' ? 2 : sh.colStyles && sh.colStyles[ci] === 'text' ? 3 : 0);
    const cols = (sh.widths || []).map((w, ci) => {
      const st = styleFor(ci);
      return `<col min="${ci + 1}" max="${ci + 1}" width="${w}" customWidth="1"${st ? ` style="${st}"` : ''}/>`;
    }).join('');
    const rowsXml = sh.rows.map((row, ri) => {
      const r = ri + 1;
      const cells = row.map((v, ci) => {
        if (v == null || v === '') return '';
        const ref = xlColName(ci) + r;
        const st = ri === 0 && sh.boldFirstRow !== false ? 1 : styleFor(ci);
        const sAttr = st ? ` s="${st}"` : '';
        if (typeof v === 'object' && v.f) {
          return `<c r="${ref}"${sAttr}><f>${xmlEsc(v.f)}</f>${v.v != null ? `<v>${v.v}</v>` : ''}</c>`;
        }
        if (typeof v === 'number' && isFinite(v)) return `<c r="${ref}"${sAttr}><v>${v}</v></c>`;
        return `<c r="${ref}"${sAttr} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
      }).join('');
      return `<row r="${r}">${cells}</row>`;
    }).join('');
    const frozen = sh.freeze !== false
      ? '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'
      : '<sheetViews><sheetView workbookViewId="0"/></sheetViews>';
    files.push({ name: `xl/worksheets/sheet${si + 1}.xml`, data: H +
      `<worksheet xmlns="${NS}" xmlns:r="${RNS}">${frozen}<sheetFormatPr defaultRowHeight="15"/>` +
      (cols ? `<cols>${cols}</cols>` : '') + `<sheetData>${rowsXml}</sheetData></worksheet>` });
  });
  return zipFiles(files);
}

/* Reads an .xlsx into { SheetName: [[cellValue,...], ...] }. Values are strings, numbers or booleans. */
async function readXlsx(buf) {
  const z = await unzip(buf);
  const wb = await z.text('xl/workbook.xml');
  if (!wb) throw new Error('This file does not look like an Excel workbook (no workbook inside).');
  const rels = (await z.text('xl/_rels/workbook.xml.rels')) || '';
  const relMap = {};
  rels.replace(/<(?:\w+:)?Relationship\b([^>]*)\/?>/g, (_, a) => { const at = xmlAttrs(a); relMap[at.Id] = at.Target; });
  const ssXml = await z.text('xl/sharedStrings.xml');
  const shared = [];
  if (ssXml) {
    ssXml.replace(/<(?:\w+:)?si\b[^>]*>([\s\S]*?)<\/(?:\w+:)?si>/g, (_, inner) => {
      shared.push(xlTextOf(inner));
    });
  }
  const out = {};
  const sheetTags = [];
  wb.replace(/<(?:\w+:)?sheet\b([^>]*)\/?>/g, (_, a) => { sheetTags.push(xmlAttrs(a)); });
  for (const at of sheetTags) {
    const rid = at['r:id'] || at.id;
    let target = relMap[rid];
    if (!target) continue;
    target = target.startsWith('/') ? target.slice(1) : 'xl/' + target.replace(/^\.\//, '');
    const xml = await z.text(target);
    if (xml == null) continue;
    out[at.name] = xlParseSheet(xml, shared);
  }
  return out;
}
function xlTextOf(inner) {
  inner = inner.replace(/<(?:\w+:)?rPh\b[\s\S]*?<\/(?:\w+:)?rPh>/g, '');
  let s = '';
  inner.replace(/<(?:\w+:)?t\b[^>]*>([\s\S]*?)<\/(?:\w+:)?t>/g, (_, t) => { s += xmlUnesc(t); });
  return s;
}
function xlParseSheet(xml, shared) {
  const rows = [];
  let nextRow = 0;
  xml.replace(/<(?:\w+:)?row\b([^>]*?)(?:\/>|>([\s\S]*?)<\/(?:\w+:)?row>)/g, (_, ra, rinner) => {
    const rat = xmlAttrs(ra);
    const rIdx = rat.r ? +rat.r - 1 : nextRow;
    nextRow = rIdx + 1;
    const row = [];
    let nextCol = 0;
    (rinner || '').replace(/<(?:\w+:)?c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/(?:\w+:)?c>)/g, (__, ca, cinner) => {
      const at = xmlAttrs(ca);
      let ci = nextCol;
      if (at.r) { const m = at.r.match(/^([A-Za-z]+)/); if (m) ci = xlColIndex(m[1]); }
      nextCol = ci + 1;
      cinner = cinner || '';
      const vm = cinner.match(/<(?:\w+:)?v\b[^>]*>([\s\S]*?)<\/(?:\w+:)?v>/);
      const v = vm ? xmlUnesc(vm[1]) : null;
      let val = null;
      const t = at.t || 'n';
      if (t === 's') val = v != null ? shared[+v] ?? '' : '';
      else if (t === 'inlineStr') val = xlTextOf(cinner);
      else if (t === 'b') val = v === '1';
      else if (t === 'str' || t === 'e') val = v ?? '';
      else if (t === 'd') val = v ?? '';
      else val = v == null || v === '' ? null : Number(v);
      row[ci] = val;
    });
    rows[rIdx] = row;
  });
  for (let i = 0; i < rows.length; i++) if (!rows[i]) rows[i] = [];
  return rows;
}

'use strict';
/* ===== Minimal PDF writer (built-in Helvetica fonts, text tables, page numbers) ===== */

// Glyph widths (1/1000 em) for characters 32..126
const HELV_W = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const HELVB_W = [278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584];

function pdfSafeText(s) {
  return String(s ?? '')
    .replace(/[‘’]/g, "'").replace(/[“”]/g, '"')
    .replace(/[‒-―−]/g, '-').replace(/…/g, '...').replace(/[›→]/g, '>')
    .replace(/[   ]/g, ' ').replace(/•/g, '·')
    .replace(/[\r\n\t]+/g, ' ')
    .replace(/[^\x20-\x7E¡-ÿ]/g, '?');
}
function pdfTextWidth(s, size, bold) {
  const t = bold ? HELVB_W : HELV_W;
  let w = 0;
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    w += c >= 32 && c <= 126 ? t[c - 32] : 556;
  }
  return (w * size) / 1000;
}
function pdfEscape(s) {
  let out = '';
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i), ch = s[i];
    if (ch === '\\' || ch === '(' || ch === ')') out += '\\' + ch;
    else if (c > 126) out += '\\' + c.toString(8).padStart(3, '0');
    else out += ch;
  }
  return out;
}
function pdfFit(s, maxW, size, bold) {
  s = pdfSafeText(s);
  if (pdfTextWidth(s, size, bold) <= maxW) return s;
  while (s.length > 1 && pdfTextWidth(s + '...', size, bold) > maxW) s = s.slice(0, -1);
  return s + '...';
}
const n2 = (v) => (Math.round(v * 100) / 100).toString();

class PdfDoc {
  constructor(landscape) {
    this.W = landscape ? 792 : 612;
    this.H = landscape ? 612 : 792;
    this.pages = [];
    this.cur = null;
  }
  addPage() { this.cur = []; this.pages.push(this.cur); }
  // y is measured from the TOP of the page (baseline position)
  text(x, y, s, { size = 10, bold = false, color = [0, 0, 0], align = 'left' } = {}) {
    s = pdfSafeText(s);
    let tx = x;
    if (align === 'right') tx = x - pdfTextWidth(s, size, bold);
    else if (align === 'center') tx = x - pdfTextWidth(s, size, bold) / 2;
    this.cur.push(`BT /${bold ? 'F2' : 'F1'} ${size} Tf ${color.map(n2).join(' ')} rg ${n2(tx)} ${n2(this.H - y)} Td (${pdfEscape(s)}) Tj ET`);
  }
  rect(x, y, w, h, color) { // y = top edge
    this.cur.push(`${color.map(n2).join(' ')} rg ${n2(x)} ${n2(this.H - y - h)} ${n2(w)} ${n2(h)} re f`);
  }
  line(x1, y1, x2, y2, width = 0.5, color = [0.75, 0.75, 0.75]) {
    this.cur.push(`${color.map(n2).join(' ')} RG ${n2(width)} w ${n2(x1)} ${n2(this.H - y1)} m ${n2(x2)} ${n2(this.H - y2)} l S`);
  }
  output(title) {
    const objs = [];
    const fontBase = 3;
    const pageIds = this.pages.map((_, i) => 5 + i * 2);
    objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
    objs[2] = `<< /Type /Pages /Kids [${pageIds.map((id) => id + ' 0 R').join(' ')}] /Count ${this.pages.length} >>`;
    objs[fontBase] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
    objs[fontBase + 1] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
    this.pages.forEach((ops, i) => {
      const pid = pageIds[i], cid = pid + 1;
      const stream = ops.join('\n');
      objs[pid] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.W} ${this.H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${cid} 0 R >>`;
      objs[cid] = `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`;
    });
    const infoId = objs.length;
    objs[infoId] = `<< /Title (${pdfEscape(pdfSafeText(title || 'Dinero'))}) /Producer (Dinero) >>`;
    let out = '%PDF-1.4\n%âãÏÓ\n';
    const offsets = [];
    for (let i = 1; i < objs.length; i++) {
      offsets[i] = out.length;
      out += `${i} 0 obj\n${objs[i]}\nendobj\n`;
    }
    const xref = out.length;
    out += `xref\n0 ${objs.length}\n0000000000 65535 f \n`;
    for (let i = 1; i < objs.length; i++) out += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
    out += `trailer\n<< /Size ${objs.length} /Root 1 0 R /Info ${infoId} 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
    const bytes = new Uint8Array(out.length);
    for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 0xFF;
    return bytes;
  }
}

/*
 * Builds a printable table report.
 * opts: { title, scopeLines: [string], columns: [{label, w (relative), align}], rows: [{cells, bold, fill, indent, color}],
 *         totals: [[label, value]], landscape, emptyText }
 */
function makeTablePdf(opts) {
  const doc = new PdfDoc(!!opts.landscape);
  const M = 36, FS = 8.5, RH = 15;
  const width = doc.W - M * 2;
  const totalW = opts.columns.reduce((a, c) => a + c.w, 0);
  let x = M;
  const cols = opts.columns.map((c) => { const w = (c.w / totalW) * width; const o = { ...c, x, w }; x += w; return o; });
  const generated = 'Generated ' + fmtDateTime(new Date().toISOString());
  let y;
  const drawHeader = () => {
    doc.rect(M, y - 10.5, width, RH, [0.90, 0.93, 0.91]);
    for (const c of cols) {
      const lbl = pdfFit(c.label, c.w - 6, FS, true);
      if (c.align === 'right') doc.text(c.x + c.w - 3, y, lbl, { size: FS, bold: true, align: 'right' });
      else doc.text(c.x + 3, y, lbl, { size: FS, bold: true });
    }
    y += RH;
  };
  const newPage = (first) => {
    doc.addPage();
    y = M + 14;
    if (first) {
      doc.text(M, y, opts.title, { size: 17, bold: true, color: [0.08, 0.32, 0.24] });
      y += 16;
      doc.text(M, y, generated, { size: 9, color: [0.4, 0.4, 0.4] });
      y += 13;
      for (const line of opts.scopeLines || []) { doc.text(M, y, line, { size: 9 }); y += 12; }
      y += 8;
    } else {
      doc.text(M, y, opts.title + ' (continued)', { size: 11, bold: true, color: [0.08, 0.32, 0.24] });
      y += 18;
    }
    drawHeader();
  };
  newPage(true);
  const bottom = doc.H - M - 18;
  if (!opts.rows.length) {
    doc.text(M + 3, y, opts.emptyText || 'No entries match.', { size: 9, color: [0.4, 0.4, 0.4] });
    y += RH;
  }
  for (const r of opts.rows) {
    if (y > bottom) newPage(false);
    if (r.fill) doc.rect(M, y - 10.5, width, RH, r.fill);
    r.cells.forEach((v, i) => {
      const c = cols[i];
      const indent = i === 0 && r.indent ? r.indent : 0;
      const s = pdfFit(v, c.w - 6 - indent, FS, !!r.bold);
      const style = { size: FS, bold: !!r.bold, color: (r.colors && r.colors[i]) || r.color || [0, 0, 0] };
      if (c.align === 'right') doc.text(c.x + c.w - 3, y, s, { ...style, align: 'right' });
      else doc.text(c.x + 3 + indent, y, s, style);
    });
    doc.line(M, y + 4.5, M + width, y + 4.5, 0.4, [0.85, 0.85, 0.85]);
    y += RH;
  }
  if (opts.totals && opts.totals.length) {
    y += 8;
    if (y + opts.totals.length * 14 > bottom) newPage(false);
    doc.line(M, y - 8, M + width, y - 8, 1, [0.3, 0.3, 0.3]);
    for (const [label, value] of opts.totals) {
      doc.text(M + 3, y + 4, label, { size: 10, bold: true });
      doc.text(M + 200, y + 4, value, { size: 10, bold: true, align: 'right' });
      y += 14;
    }
  }
  const n = doc.pages.length;
  doc.pages.forEach((ops, i) => {
    doc.cur = ops;
    doc.line(M, doc.H - M + 2, doc.W - M, doc.H - M + 2, 0.5);
    doc.text(M, doc.H - M + 14, 'Dinero - ' + opts.title, { size: 8, color: [0.4, 0.4, 0.4] });
    doc.text(doc.W - M, doc.H - M + 14, `Page ${i + 1} of ${n}`, { size: 8, color: [0.4, 0.4, 0.4], align: 'right' });
  });
  return doc.output(opts.title);
}

// ---- storage.js ----
'use strict';
/* ===== On-device storage: IndexedDB (preferred) with a localStorage mirror/fallback ===== */

const STORE_DB = 'dinero';
const STORE_NAME = 'kv';
const LS_PREFIX = 'dinero:';
const Storage = {
  idb: null,
  lsOk: false,
  engine: 'none',

  async init() {
    try { localStorage.setItem(LS_PREFIX + 'probe', '1'); localStorage.removeItem(LS_PREFIX + 'probe'); this.lsOk = true; } catch (e) { this.lsOk = false; }
    this.idb = await new Promise((resolve) => {
      let done = false;
      const finish = (v) => { if (!done) { done = true; resolve(v); } };
      try {
        if (typeof indexedDB === 'undefined') return finish(null);
        const req = indexedDB.open(STORE_DB, 1);
        req.onupgradeneeded = () => { req.result.createObjectStore(STORE_NAME); };
        req.onsuccess = () => finish(req.result);
        req.onerror = () => finish(null);
        req.onblocked = () => finish(null);
        setTimeout(() => finish(null), 4000);
      } catch (e) { finish(null); }
    });
    if (this.idb) {
      try { await this._idbPut('probe', 1); } catch (e) { this.idb = null; }
    }
    this.engine = this.idb ? 'IndexedDB' : this.lsOk ? 'localStorage' : 'none';
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* optional */ }
    return this.engine;
  },
  _idbPut(key, val) {
    return new Promise((res, rej) => {
      const tx = this.idb.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).put(val, key);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error);
    });
  },
  _idbGet(key) {
    return new Promise((res, rej) => {
      const tx = this.idb.transaction(STORE_NAME, 'readonly');
      const q = tx.objectStore(STORE_NAME).get(key);
      q.onsuccess = () => res(q.result);
      q.onerror = () => rej(q.error);
    });
  },
  // Values are wrapped as {savedAt, value}; on load the newest copy (IndexedDB or localStorage) wins.
  async get(key) {
    let a, b;
    if (this.idb) { try { a = await this._idbGet(key); } catch (e) { a = undefined; } }
    if (this.lsOk) { try { const s = localStorage.getItem(LS_PREFIX + key); b = s ? JSON.parse(s) : undefined; } catch (e) { b = undefined; } }
    const best = [a, b].filter((x) => x && x.savedAt).sort((x, y) => y.savedAt - x.savedAt)[0];
    return best ? best.value : undefined;
  },
  async set(key, value) {
    const rec = { savedAt: Date.now(), value };
    let ok = false;
    if (this.idb) { try { await this._idbPut(key, rec); ok = true; } catch (e) { ok = false; } }
    if (this.lsOk) {
      try { localStorage.setItem(LS_PREFIX + key, JSON.stringify(rec)); ok = true; } catch (e) { /* quota: IndexedDB copy is the main one */ }
    }
    return ok;
  },
  async clearAll() {
    if (this.idb) { try { await new Promise((res, rej) => { const tx = this.idb.transaction(STORE_NAME, 'readwrite'); tx.objectStore(STORE_NAME).clear(); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); } catch (e) { /* ignore */ } }
    if (this.lsOk) { try { Object.keys(localStorage).filter((k) => k.startsWith(LS_PREFIX)).forEach((k) => localStorage.removeItem(k)); } catch (e) { /* ignore */ } }
  },
};

'use strict';
/* ===== Data model, calculation rules, import/export ===== */

const ACCOUNT_TYPES = ['Checking', 'Savings', 'Credit Card', 'Cash', 'Other'];
const CAT_KINDS = ['Income', 'Expense', 'Both'];
const ID_SPEC = {
  accounts: ['acct_', 3], categories: ['cat_', 3], transactions: ['txn_', 6],
  transfers: ['xfr_', 5], recurring: ['rec_', 3], bills: ['bill_', 4],
};
// Exact Excel sheet names and column headings (identical to the earlier version of the app).
const SHEET_COLUMNS = {
  Accounts: ['id', 'name', 'type', 'opening_balance', 'opening_date', 'notes', 'is_active'],
  Categories: ['id', 'name', 'parent_name', 'kind'],
  Transactions: ['id', 'date', 'account_id', 'account_name', 'payee', 'description', 'category', 'check_number', 'amount', 'cleared', 'transfer_id', 'entry_order'],
  Transfers: ['id', 'date', 'from_account_name', 'to_account_name', 'amount', 'description'],
  Recurring: ['id', 'payee', 'direction', 'amount', 'account_name', 'category', 'frequency', 'start_date', 'next_due_date', 'end_date', 'auto_post', 'days_in_advance', 'status', 'memo', 'last_posted_for_date'],
  Bills: ['id', 'payee', 'amount', 'due_date', 'pay_from_account_name', 'category', 'status', 'paid_date', 'linked_transaction_id', 'is_recurring', 'frequency', 'end_date', 'notes'],
};
const REQUIRED_COLUMNS = {
  Accounts: ['name'], Categories: ['name'], Transactions: ['date', 'amount'],
  Transfers: ['date', 'from_account_name', 'to_account_name', 'amount'],
  Recurring: ['payee', 'amount', 'frequency', 'account_name'], Bills: ['payee', 'amount', 'due_date'],
};
const SHEET_TO_KEY = { Accounts: 'accounts', Categories: 'categories', Transactions: 'transactions', Transfers: 'transfers', Recurring: 'recurring', Bills: 'bills' };

function emptyDb() {
  return { schema: 1, accounts: [], categories: [], transactions: [], transfers: [], recurring: [], bills: [] };
}
const money = (v) => centsToNum(toCents(v) || 0);
const s0 = (v) => (v == null ? '' : String(v));

function normalizeDb(d) {
  const db = emptyDb();
  d = d || {};
  db.accounts = (d.accounts || []).map((a) => ({
    id: s0(a.id), name: s0(a.name), type: ACCOUNT_TYPES.includes(a.type) ? a.type : 'Other',
    opening_balance: money(a.opening_balance), opening_date: s0(a.opening_date), notes: s0(a.notes),
    is_active: a.is_active === false || a.is_active === 'No' ? false : true,
  }));
  db.categories = (d.categories || []).map((c) => ({
    id: s0(c.id), name: s0(c.name), parent_name: s0(c.parent_name), kind: CAT_KINDS.includes(c.kind) ? c.kind : 'Both',
  }));
  db.transactions = (d.transactions || []).map((t) => ({
    id: s0(t.id), date: s0(t.date), account_id: s0(t.account_id), payee: s0(t.payee), description: s0(t.description),
    category: s0(t.category), check_number: s0(t.check_number), amount: money(t.amount),
    cleared: t.cleared === true || t.cleared === 'Cleared', transfer_id: s0(t.transfer_id),
    entry_order: Number(t.entry_order) || 0,
    ...(t.bill_id ? { bill_id: s0(t.bill_id) } : {}),
    ...(t.recurring_id ? { recurring_id: s0(t.recurring_id) } : {}),
    ...(t.auto_posted_on ? { auto_posted_on: s0(t.auto_posted_on) } : {}),
  }));
  db.transfers = (d.transfers || []).map((x) => ({
    id: s0(x.id), date: s0(x.date), from_account_id: s0(x.from_account_id), to_account_id: s0(x.to_account_id),
    amount: Math.abs(money(x.amount)), description: s0(x.description),
  }));
  db.recurring = (d.recurring || []).map((r) => ({
    id: s0(r.id), payee: s0(r.payee), direction: r.direction === 'In' ? 'In' : 'Out', amount: Math.abs(money(r.amount)),
    account_id: s0(r.account_id), category: s0(r.category), frequency: FREQUENCIES.includes(r.frequency) ? r.frequency : 'Monthly',
    start_date: s0(r.start_date), next_due_date: s0(r.next_due_date), end_date: s0(r.end_date),
    auto_post: r.auto_post === true || r.auto_post === 'Yes', days_in_advance: Math.max(0, Math.min(90, parseInt(r.days_in_advance, 10) || 0)),
    status: r.status === 'Paused' ? 'Paused' : 'Active', memo: s0(r.memo), last_posted_for_date: s0(r.last_posted_for_date),
  }));
  db.bills = (d.bills || []).map((b) => ({
    id: s0(b.id), payee: s0(b.payee), amount: Math.abs(money(b.amount)), due_date: s0(b.due_date),
    account_id: s0(b.account_id), category: s0(b.category), status: b.status === 'Paid' ? 'Paid' : 'Unpaid',
    paid_date: s0(b.paid_date), linked_transaction_id: s0(b.linked_transaction_id),
    is_recurring: b.is_recurring === true || b.is_recurring === 'Yes', frequency: FREQUENCIES.includes(b.frequency) ? b.frequency : '',
    end_date: s0(b.end_date), notes: s0(b.notes), next_bill_id: s0(b.next_bill_id),
  }));
  return db;
}

function nextId(list, key) {
  const [prefix, width] = ID_SPEC[key];
  let max = 0;
  for (const x of list) {
    if (x.id && x.id.startsWith(prefix)) { const n = parseInt(x.id.slice(prefix.length), 10); if (n > max) max = n; }
  }
  return prefix + pad(max + 1, width);
}

/* ---------- Lookups ---------- */

  for (const t of db.transactions) if (t.payee && !t.transfer_id) set.set(norm(t.payee), t.payee);
  for (const b of db.bills) if (b.payee) set.set(norm(b.payee), b.payee);
  for (const r of db.recurring) if (r.payee) set.set(norm(r.payee), r.payee);
  return [...set.values()].sort((a, b) => a.localeCompare(b));
}

/* ---------- Categories ---------- */

function catTree(db) {

  const out = [];
  for (const t of tops) {
    out.push({ cat: t, path: t.name, depth: 0 });
    for (const ch of db.categories.filter((c) => norm(c.parent_name) === norm(t.name)).sort(byName)) {
      out.push({ cat: ch, path: catPath(ch), depth: 1 });
    }
  }
  // Orphans (parent missing) last, so nothing disappears from view
  for (const c of db.categories) if (c.parent_name && !tops.some((t) => norm(t.name) === norm(c.parent_name))) out.push({ cat: c, path: catPath(c), depth: 1, orphan: true });

}

function txnInCategory(t, sel) {

/* ---------- Ordering and balances (rules 1-4) ---------- */

  return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
}
function computeBalances(db) {

    const open = toCents(a.opening_balance) || 0;
    byAcct.set(a.id, { open, run: open, clr: open, count: 0 });
  }
  const row = new Map();
  const sorted = [...db.transactions].sort(txnSort);
  for (const t of sorted) {
    const b = byAcct.get(t.account_id);
    if (!b) continue;
    const c = toCents(t.amount);
    b.run += c;
    if (t.cleared) b.clr += c;
    b.count++;

// Rule 7

/* ---------- Transactions ---------- */
function saveTxn(db, input) {
  if (!isDate(input.date)) return { error: 'Date: enter a valid date.' };
  if (!acctById(db, input.account_id)) return { error: 'Account: choose an account.' };
  if (!isFinite(input.amountC) || input.amountC === 0) return { error: 'Amount: enter an amount greater than zero.' };
  const cat = canonicalCat(db, input.category || '');
  if (cat === null) return { error: `Category: "${input.category}" does not exist. Add it on the Categories tab first.` };
  let t = input.id ? db.transactions.find((x) => x.id === input.id) : null;
  if (!t) {
    t = { id: nextId(db.transactions, 'transactions'), date: input.date, account_id: '', payee: '', description: '', category: '', check_number: '', amount: 0, cleared: false, transfer_id: '', entry_order: nextEntryOrder(db, input.date) };
    db.transactions.push(t);
  } else if (t.date !== input.date) {
    t.entry_order = nextEntryOrder(db, input.date, t.id);
  }
  Object.assign(t, {
    date: input.date, account_id: input.account_id, payee: (input.payee || '').trim(), description: (input.description || '').trim(),
    category: cat, check_number: String(input.check_number || '').trim(), amount: centsToNum(input.amountC), cleared: !!input.cleared,

}
function deleteTxn(db, id) {
  const t = db.transactions.find((x) => x.id === id);
  if (!t) return;
  if (t.transfer_id) return deleteTransfer(db, t.transfer_id);
  for (const b of db.bills) {
    if (b.linked_transaction_id === id) { b.status = 'Unpaid'; b.paid_date = ''; b.linked_transaction_id = ''; }
  }
  db.transactions = db.transactions.filter((x) => x.id !== id);
}
function lastCategoryForPayee(db, payee) {
  const p = norm(payee);
  if (!p) return '';
  const hits = db.transactions.filter((t) => norm(t.payee) === p && t.category).sort(txnSort);
  return hits.length ? hits[hits.length - 1].category : '';
}

/* ---------- Accounts ---------- */
function saveAccount(db, input) {
  const name = (input.name || '').trim();
  if (!name) return { error: 'Account name: enter a name.' };
  if (name.includes('>')) return { error: 'Account name: please do not use the ">" character.' };
  if (db.accounts.some((a) => a.id !== input.id && norm(a.name) === norm(name))) return { error: `Account name: there is already an account called "${name}".` };
  if (!ACCOUNT_TYPES.includes(input.type)) return { error: 'Type: choose Checking, Savings, Credit Card, Cash, or Other.' };
  if (!isFinite(input.openingC)) return { error: 'Opening balance: enter a number, like 1000.00 (use a minus sign for money owed).' };
  if (input.opening_date && !isDate(input.opening_date)) return { error: 'Opening date: enter a valid date or leave it blank.' };
  let a = input.id ? acctById(db, input.id) : null;
  if (!a) { a = { id: nextId(db.accounts, 'accounts') }; db.accounts.push(a); }
  Object.assign(a, { name, type: input.type, opening_balance: centsToNum(input.openingC), opening_date: input.opening_date || '', notes: (input.notes || '').trim(), is_active: !!input.is_active });
  refreshTransferPayees(db);

}
function accountUsage(db, id) {
  return db.transactions.filter((t) => t.account_id === id).length + db.recurring.filter((r) => r.account_id === id).length + db.bills.filter((b) => b.account_id === id).length;
}
function deleteAccount(db, id) {
  if (accountUsage(db, id)) return { error: 'This account has entries, recurring items, or bills, so it cannot be deleted. Turn off "Active" instead — it will be hidden from pickers but keep its history.' };
  db.accounts = db.accounts.filter((a) => a.id !== id);
  return {};
}

/* ---------- Transfers (rule 5) ---------- */
function transferSides(db, id) {
  const all = db.transactions.filter((t) => t.transfer_id === id);
  return { all, from: all.find((t) => toCents(t.amount) < 0), to: all.find((t) => toCents(t.amount) > 0) };
}
function refreshTransferPayees(db) {
  for (const x of db.transfers) {
    const s = transferSides(db, x.id);
    if (s.from) s.from.payee = 'Transfer to ' + acctName(db, x.to_account_id);
    if (s.to) s.to.payee = 'Transfer from ' + acctName(db, x.from_account_id);
  }
}
function saveTransfer(db, input) {
  if (!isDate(input.date)) return { error: 'Date: enter a valid date.' };
  if (!acctById(db, input.from_account_id)) return { error: 'From account: choose the account the money leaves.' };
  if (!acctById(db, input.to_account_id)) return { error: 'To account: choose the account the money arrives in.' };
  if (input.from_account_id === input.to_account_id) return { error: 'From and To are the same account. A transfer moves money between two different accounts, so choose a different To account.' };
  if (!isFinite(input.amountC) || input.amountC <= 0) return { error: 'Amount: enter an amount greater than zero.' };
  let x = input.id ? db.transfers.find((t) => t.id === input.id) : null;
  if (!x) { x = { id: nextId(db.transfers, 'transfers') }; db.transfers.push(x); }
  const dateChanged = x.date !== input.date;
  Object.assign(x, { date: input.date, from_account_id: input.from_account_id, to_account_id: input.to_account_id, amount: centsToNum(input.amountC), description: (input.description || '').trim() });
  let { from, to, all } = transferSides(db, x.id);
  // Remove any stray extra sides so there are always exactly two.
  const keep = new Set([from && from.id, to && to.id]);
  if (all.length > 2 || all.some((t) => !keep.has(t.id))) db.transactions = db.transactions.filter((t) => t.transfer_id !== x.id || keep.has(t.id));
  const mk = () => {
    const t = { id: nextId(db.transactions, 'transactions'), date: x.date, account_id: '', payee: '', description: '', category: '', check_number: '', amount: 0, cleared: false, transfer_id: x.id, entry_order: nextEntryOrder(db, x.date) };
    db.transactions.push(t);
    return t;
  };
  if (!from) from = mk();
  if (!to) to = mk();
  for (const t of [from, to]) {
    if (dateChanged && t.date !== x.date) t.entry_order = nextEntryOrder(db, x.date, t.id);
    t.date = x.date;
    t.description = x.description;
    t.category = '';
    if (input.cleared !== undefined) t.cleared = !!input.cleared;
  }
  from.account_id = x.from_account_id; from.amount = -x.amount;
  to.account_id = x.to_account_id; to.amount = x.amount;
  if (input.check_number !== undefined) from.check_number = String(input.check_number || '').trim();

}
function deleteTransfer(db, id) {
  db.transfers = db.transfers.filter((x) => x.id !== id);
  db.transactions = db.transactions.filter((t) => t.transfer_id !== id);
}

/* ---------- Category editing ---------- */
function categoryUsage(db, path) {

}

function saveCategory(db, input) {

  if (!CAT_KINDS.includes(input.kind)) return { error: 'Kind: choose Income, Expense, or Both.' };
  const existing = input.id ? db.categories.find((c) => c.id === input.id) : null;
  if (parent) {

    if (!p) return { error: `Parent: "${parent}" is not a top-level category.` };
    if (existing && p.id === existing.id) return { error: 'Parent: a category cannot be its own parent.' };
    if (existing && !existing.parent_name && db.categories.some((c) => norm(c.parent_name) === norm(existing.name))) {

    }

// Rule 6: parents include their subcategories. Transfers are not counted.
function categorySummary(db, txns) {
  const map = new Map();
  const add = (p, c) => {
    if (!map.has(p)) map.set(p, { inC: 0, outC: 0, count: 0 });
    const m = map.get(p);
    if (c > 0) m.inC += c; else m.outC += -c;
    m.count++;
  };
  for (const t of txns) if (!t.transfer_id) add(t.category || '', toCents(t.amount));
  const rows = [];
  const used = new Set();
  const tops = db.categories.filter((c) => !c.parent_name).sort((a, b) => a.name.localeCompare(b.name));
  for (const top of tops) {
    const own = map.get(top.name) || { inC: 0, outC: 0, count: 0 };
    used.add(top.name);
    const kids = [];
    for (const ch of db.categories.filter((c) => norm(c.parent_name) === norm(top.name)).sort((a, b) => a.name.localeCompare(b.name))) {
      const p = catPath(ch);
      used.add(p);
      const m = map.get(p);
      if (m && m.count) kids.push({ path: p, name: ch.name, depth: 1, ...m, net: m.inC - m.outC });
    }
    const tot = kids.reduce((a, k) => ({ inC: a.inC + k.inC, outC: a.outC + k.outC, count: a.count + k.count }), { ...own });
    if (tot.count) {
      rows.push({ path: top.name, name: top.name, depth: 0, ...tot, net: tot.inC - tot.outC, ownCount: own.count });
      rows.push(...kids);
    }
  }
  for (const [p, m] of map) {
    if (used.has(p) || p === '' || !m.count) continue;
    rows.push({ path: p, name: p + ' (not in category list)', depth: 0, ...m, net: m.inC - m.outC });
  }
  const un = map.get('');
  if (un && un.count) rows.push({ path: '__none__', name: 'Uncategorized', depth: 0, ...un, net: un.inC - un.outC });

  return { rows, totals: all };
}

/* ---------- Report filtering ---------- */
function filterTxns(db, f) {
  const payees = allPayees(db).map(norm);
  const p = norm(f.payee);
  const exactPayee = p && payees.includes(p);
  const q = norm(f.q);
  return db.transactions.filter((t) => {
    if (f.start && t.date < f.start) return false;
    if (f.end && t.date > f.end) return false;
    if (f.acct && t.account_id !== f.acct) return false;
    if (f.cat && !txnInCategory(t, f.cat)) return false;
    if (f.status === 'cleared' && !t.cleared) return false;
    if (f.status === 'pending' && t.cleared) return false;
    if (p) { const tp = norm(t.payee); if (exactPayee ? tp !== p : !tp.includes(p)) return false; }
    if (q) {
      const c = Math.abs(toCents(t.amount));
      const hay = [t.payee, t.description, t.category, t.check_number, fixed2(c), fmt(c), String(centsToNum(c))].map(norm).join('\u0001');
      if (!hay.includes(q.replace(/^\$/, '').replace(/,/g, '')) && !hay.includes(q)) return false;
    }
    return true;
  }).sort(txnSort);
}
function presetRange(preset, t) {
  const y = t.slice(0, 4);
  switch (preset) {
    case 'this_month': return [monthStart(t), monthEnd(t)];
    case 'last_month': { const lm = addMonths(monthStart(t), -1); return [lm, monthEnd(lm)]; }
    case 'ytd': return [y + '-01-01', t];
    case 'this_year': return [y + '-01-01', y + '-12-31'];
    case 'last_year': return [(+y - 1) + '-01-01', (+y - 1) + '-12-31'];
    case 'all': return ['', ''];
  }
  return null;
}

/* ---------- Recurring (rules 9, section 10) ---------- */

function saveRecurring(db, input) {

  if (!isFinite(input.amountC) || input.amountC <= 0) return { error: 'Amount: enter an amount greater than zero.' };
  if (!FREQUENCIES.includes(input.frequency)) return { error: 'Frequency: choose how often it repeats.' };
  if (!acctById(db, input.account_id)) return { error: 'Account: choose the account it posts to.' };
  if (!isDate(input.start_date)) return { error: 'Start date: enter a valid date.' };
  const next = input.next_due_date || input.start_date;
  if (!isDate(next)) return { error: 'Next due date: enter a valid date.' };
  if (input.end_date && !isDate(input.end_date)) return { error: 'End date: enter a valid date or leave it blank.' };
  if (input.end_date && input.end_date < input.start_date) return { error: 'End date: must be on or after the start date.' };
  const days = Number(input.days_in_advance);
  if (!Number.isInteger(days) || days < 0 || days > 90) return { error: 'Days in advance: enter a whole number from 0 to 90.' };
  const cat = canonicalCat(db, input.category || '');
  if (cat === null) return { error: `Category: "${input.category}" does not exist.` };
  let r = input.id ? db.recurring.find((x) => x.id === input.id) : null;
  if (!r) { r = { id: nextId(db.recurring, 'recurring'), last_posted_for_date: '' }; db.recurring.push(r); }
  Object.assign(r, {
    payee: input.payee.trim(), direction: input.direction === 'In' ? 'In' : 'Out', amount: centsToNum(input.amountC), account_id: input.account_id,
    category: cat, frequency: input.frequency, start_date: input.start_date, next_due_date: next, end_date: input.end_date || '',
    auto_post: !!input.auto_post, days_in_advance: days, status: input.status === 'Paused' ? 'Paused' : 'Active', memo: (input.memo || '').trim(),

function postRecurring(db, r, opts = {}) {

  const res = saveTxn(db, { date: due, account_id: r.account_id, payee: r.payee, description: r.memo, category: r.category, amountC: r.direction === 'In' ? c : -c, cleared: false });
  if (res.error) return res;
  res.txn.recurring_id = r.id;
  if (opts.auto) res.txn.auto_posted_on = opts.today;
  r.last_posted_for_date = due;

}

    for (let guard = 0; guard < 1000; guard++) {
      if (!isDate(r.next_due_date) || recurringEnded(r)) break;

      if (r.last_posted_for_date === r.next_due_date) { r.next_due_date = advanceDate(r.next_due_date, r.frequency); continue; }
      const res = postRecurring(db, r, { auto: true, today: todayStr });

}

/* ---------- Bills (rule 8) ---------- */

function dataCheck(db) {

  for (const key of Object.keys(ID_SPEC)) {
    const seen = new Set();
    for (const x of db[key]) {
      if (!x.id) p.push(`A record in ${key} has no id.`);
      else if (seen.has(x.id)) p.push(`Two records in ${key} share the id ${x.id}.`);
      seen.add(x.id);
    }
  }
  const names = new Set();
  for (const a of db.accounts) { if (names.has(norm(a.name))) p.push(`Two accounts are named "${a.name}".`); names.add(norm(a.name)); }
  const xfers = new Map(db.transfers.map((x) => [x.id, x]));
  for (const t of db.transactions) {
    if (!acctById(db, t.account_id)) p.push(`Entry ${t.id} (${fmtDate(t.date)}, ${t.payee || 'no payee'}) points at an account that does not exist (${t.account_id || 'blank'}).`);
    if (!isDate(t.date)) p.push(`Entry ${t.id} has an invalid date "${t.date}".`);
    if (t.category && canonicalCat(db, t.category) === null) p.push(`Entry ${t.id} uses category "${t.category}", which is not in the category list.`);
    if (t.transfer_id && !xfers.has(t.transfer_id)) p.push(`Entry ${t.id} says it is part of transfer ${t.transfer_id}, but that transfer does not exist.`);
  }
  for (const x of db.transfers) {
    const s = transferSides(db, x.id);
    if (s.all.length !== 2 || !s.from || !s.to) p.push(`Transfer ${x.id} (${fmtDate(x.date)}) has ${s.all.length === 1 ? 'only one side' : s.all.length + ' sides'} in the register instead of two. Open and save it on the Transfers tab to repair it.`);
    else if (toCents(s.from.amount) + toCents(s.to.amount) !== 0 || Math.abs(toCents(s.to.amount)) !== toCents(x.amount)) p.push(`Transfer ${x.id}: its two register entries do not match its amount. Open and save it on the Transfers tab to repair it.`);
    else if (s.from.account_id !== x.from_account_id || s.to.account_id !== x.to_account_id) p.push(`Transfer ${x.id}: its register entries are in different accounts than the transfer says. Open and save it to repair it.`);
  }
  for (const c of db.categories) {
    if (c.parent_name) {
      const par = db.categories.find((x) => norm(x.name) === norm(c.parent_name) && !x.parent_name);
      if (!par) p.push(`Subcategory "${catPath(c)}" has a parent "${c.parent_name}" that does not exist as a top-level category.`);
    }
  }
  for (const b of db.bills) {
    if (b.status === 'Paid' && !b.linked_transaction_id) p.push(`Bill ${b.id} (${b.payee}, due ${fmtDate(b.due_date)}) is marked Paid but has no linked register entry.`);
    else if (b.status === 'Paid' && !db.transactions.some((t) => t.id === b.linked_transaction_id)) p.push(`Bill ${b.id} (${b.payee}) is marked Paid, but its linked register entry ${b.linked_transaction_id} no longer exists.`);
    if (b.account_id && !acctById(db, b.account_id)) p.push(`Bill ${b.id} (${b.payee}) pays from an account that does not exist.`);
  }
  for (const r of db.recurring) {
    if (!acctById(db, r.account_id)) p.push(`Recurring entry ${r.id} (${r.payee}) posts to an account that does not exist.`);
    if (!isDate(r.next_due_date)) p.push(`Recurring entry ${r.id} (${r.payee}) has no valid next due date.`);
  }
  return p;
}

      const category = catField('Recurring', row, get('category'));
      const frequency = choice('Recurring', row, 'frequency', get('frequency'), FREQUENCIES, undefined);
      if (frequency === undefined && !norm(get('frequency'))) err('Recurring', row, 'frequency is missing.');
      let start = dateField('Recurring', row, 'start_date', get('start_date'), false);
      let next = dateField('Recurring', row, 'next_due_date', get('next_due_date'), false);
      if (start === '' && next === '') err('Recurring', row, 'start_date and next_due_date are both missing. Enter at least one.');
      if (start === '') start = next;
      if (next === '') next = start;
      const end = dateField('Recurring', row, 'end_date', get('end_date'), false);
      const auto = yn('Recurring', row, 'auto_post', get('auto_post'), false);
      let days = 0;
      const dr = get('days_in_advance');
      if (dr != null && String(dr).trim() !== '') { days = Number(dr); if (!Number.isInteger(days) || days < 0 || days > 90) err('Recurring', row, `days_in_advance must be a whole number from 0 to 90 (found "${str(dr)}").`); }
      const status = choice('Recurring', row, 'status', get('status'), ['Active', 'Paused'], 'Active');
      const last = dateField('Recurring', row, 'last_posted_for_date', get('last_posted_for_date'), false);
      if (errors.length > e0) continue;
      const r = { id: id.id, payee, direction, amount, account_id: acct, category, frequency, start_date: start, next_due_date: next, end_date: end, auto_post: auto, days_in_advance: days, status, memo: str(get('memo')), last_posted_for_date: last };
      db.recurring.push(r); added.push(r);
    }
    assignIds('recurring', added); stats.added.recurring = added.length; }

  // Bills
  { const seen = new Map(); const added = [];
    for (const { row, get } of readSheet('Bills')) {
      const e0 = errors.length;
      const id = takeId('Bills', 'bills', row, get('id'), seen);
      if (id.skip || id.bad) continue;
      const payee = str(get('payee'));
      if (!payee) err('Bills', row, 'payee is missing.');
      const amount = moneyField('Bills', row, 'amount', get('amount'), { positive: true });
      const due = dateField('Bills', row, 'due_date', get('due_date'), true);
      const acct = acctField('Bills', row, 'pay_from_account_name', get('pay_from_account_name'), null, false);
      const category = catField('Bills', row, get('category'));
      let status = norm(get('status')) === 'past due' ? 'Unpaid' : choice('Bills', row, 'status', get('status'), ['Unpaid', 'Paid'], 'Unpaid');
      const paid = dateField('Bills', row, 'paid_date', get('paid_date'), false);
      const isRec = yn('Bills', row, 'is_recurring', get('is_recurring'), false);
      const freq = str(get('frequency')) ? choice('Bills', row, 'frequency', get('frequency'), FREQUENCIES, '') : '';
      if (isRec && !freq && !str(get('frequency'))) err('Bills', row, 'is_recurring is Yes, so frequency is required.');
      const end = dateField('Bills', row, 'end_date', get('end_date'), false);
      if (errors.length > e0) continue;
      const b = { id: id.id, payee, amount, due_date: due, account_id: acct, category, status, paid_date: paid, linked_transaction_id: str(get('linked_transaction_id')), is_recurring: !!isRec, frequency: freq || '', end_date: end, notes: str(get('notes')), next_bill_id: '' };
      if (b.linked_transaction_id && !db.transactions.some((t) => t.id === b.linked_transaction_id)) warnings.push(`Bills row ${row}: linked_transaction_id "${b.linked_transaction_id}" is not in the Transactions sheet.`);
      db.bills.push(b); added.push(b);
    }
    assignIds('bills', added); stats.added.bills = added.length; }

  if (errors.length === before) {
    for (const t of db.transactions) if (t.transfer_id && !db.transfers.some((x) => x.id === t.transfer_id)) warnings.push(`Transactions: entry ${t.id} has transfer_id "${t.transfer_id}", but there is no such row in the Transfers sheet.`);
    for (const t of db.transactions) if (t.bill_id && !db.bills.some((b) => b.id === t.bill_id)) delete t.bill_id;
  }
  return { errors, warnings, db: normalizeDb(db), stats };
}

/* ---------- Backup files ---------- */
function makeBackup(db) {
  return { app: 'Dinero', format: 'dinero-backup', version: 1, exported_at: new Date().toISOString(), counts: countsOf(db), data: db };
}
function parseBackup(text) {
  let o;
  try { o = JSON.parse(text); } catch (e) { throw new Error('This file is not a Dinero backup — it could not be read as a backup file (JSON).'); }
  const d = o && (o.data || o);
  if (!d || !Array.isArray(d.accounts) || !Array.isArray(d.transactions)) throw new Error('This file is not a Dinero backup — it does not contain accounts and transactions.');
  return { exported_at: o.exported_at || null, db: normalizeDb(d) };
}

/* ---------- Saving ---------- */
let saveChain = Promise.resolve();

  const snapshot = deepClone(DB), dev = { ...DEV };

    const ok = await Storage.set('data', snapshot);

  });

}

}

/* ---------- Toasts ---------- */
function toast(msg, bad = false) {
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad' : '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
