/* ---------- Modals ---------- */
const modalStack = [];
function openModal({ title, body, wide = false, onClose }) {
  const el = document.createElement('div');
  el.className = 'overlay';
  el.innerHTML = `<div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <header><h2>${esc(title)}</h2><button type="button" class="icon-btn" data-close aria-label="Close">✕</button></header>
    <div class="modal-body">${body}</div></div>`;
  el._onClose = onClose;
  el.querySelector('[data-close]').onclick = () => closeModal(el);
  document.body.appendChild(el);
  modalStack.push(el);
  document.body.style.overflow = 'hidden';
  if (matchMedia('(pointer: fine)').matches) {
    const f = el.querySelector('input:not([type=hidden]):not([type=checkbox]):not([type=radio]), select, textarea');
    if (f) setTimeout(() => f.focus(), 30);
  }
  return el;
}
function closeModal(el, silent = false) {
  el = el || modalStack[modalStack.length - 1];
  if (!el) return;
  const i = modalStack.indexOf(el);
  if (i >= 0) modalStack.splice(i, 1);
  el.remove();
  if (!modalStack.length) document.body.style.overflow = '';
  if (!silent && el._onClose) el._onClose();
}
function confirmBox({ title, body, ok = 'OK', cancel = 'Cancel', danger = false }) {
  return new Promise((resolve) => {
    const m = openModal({ title, body: `<div>${body}</div><div class="actions"><button type="button" class="btn" data-x="no">${esc(cancel)}</button><button type="button" class="btn ${danger ? 'danger' : 'primary'}" data-x="yes">${esc(ok)}</button></div>`, onClose: () => resolve(false) });
    m.querySelector('[data-x=no]').onclick = () => { closeModal(m, true); resolve(false); };
    m.querySelector('[data-x=yes]').onclick = () => { closeModal(m, true); resolve(true); };
  });
}
// Builds a modal around a <form>; handler(form) returns an error string to show, or nothing to close.
function formModal({ title, fields, submit = 'Save', extraButtons = '', wide = false, onSubmit, after }) {
  const m = openModal({ title, wide, body: `<form novalidate autocomplete="off"><div class="form-error" role="alert"></div>${fields}
    <div class="actions">${extraButtons}<span class="spacer"></span><button type="button" class="btn" data-x="cancel">Cancel</button><button type="submit" class="btn primary">${esc(submit)}</button></div></form>` });
  const form = m.querySelector('form');
  const errBox = m.querySelector('.form-error');
  m.querySelector('[data-x=cancel]').onclick = () => closeModal(m, true);
  form.onsubmit = async (e) => {
    e.preventDefault();
    const err = await onSubmit(form, m);
    if (err) { errBox.textContent = err; errBox.scrollIntoView({ block: 'nearest' }); }
    else closeModal(m, true);
  };
  if (after) after(form, m);
  return m;
}
const fv = (form, name) => { const el = form.elements[name]; return el ? (el.type === 'checkbox' ? el.checked : el.value) : ''; };
function radioVal(form, name) { const el = form.querySelector(`input[name="${name}"]:checked`); return el ? el.value : ''; }
function amountField(form, name, label) {
  const raw = String(fv(form, name)).trim();
  if (!raw) return { error: `${label}: enter an amount.` };
  const n = parseMoney(raw);
  if (!isFinite(n)) return { error: `${label}: "${raw}" is not a number. Type something like 12.50.` };
  if (n <= 0) return { error: `${label}: enter an amount greater than zero. Choose Money in or Money out instead of typing a minus sign.` };
  return { c: toCents(n) };
}

/* ---------- Rendering ---------- */
const VIEWS = {};
function render() {
  const sameTab = render._last === UI.tab;
  render._last = UI.tab;
  const y = window.scrollY;
  for (const b of document.querySelectorAll('#tabs [data-tab]')) {
    if (b.dataset.tab === UI.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  }
  const syncBtn = $('#tabs [data-tab=settings]');
  const unsaved = DEV.dirty && hasData();
  syncBtn.innerHTML = 'Sync / Settings' + (unsaved ? '<span class="dot" title="Changes not saved to your Dinero file yet"></span>' : '');
  const sb = $('#saveBtn');
  if (sb) {
    sb.hidden = !hasData();
    sb.classList.toggle('unsaved', !!unsaved);
    sb.innerHTML = unsaved ? '<span class="dot" aria-hidden="true"></span>Save' : 'Saved ✓';
    sb.title = unsaved ? 'You have changes that are not in your Dinero file yet. Tap to save.' : 'Everything is saved to your Dinero file. Tap to save again.';
  }
  $('#main').innerHTML = VIEWS[UI.tab]();
  if (sameTab) window.scrollTo(0, y);
}
function go(tab) {
  UI.tab = tab;
  render();
  window.scrollTo(0, 0);
  const active = $(`#tabs [data-tab="${tab}"]`);
  if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

/* ---------- Events ---------- */
const ACTIONS = {};
const BINDS = {};
document.addEventListener('click', (e) => {
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn) { e.preventDefault(); go(tabBtn.dataset.tab); return; }
  const a = e.target.closest('[data-act]');
  if (a && ACTIONS[a.dataset.act]) { e.preventDefault(); ACTIONS[a.dataset.act](a.dataset, a, e); }
});
function bindHandler(e, kind) {
  const el = e.target.closest && e.target.closest('[data-bind]');
  if (!el || !BINDS[el.dataset.bind]) return;
  const isText = el.tagName === 'INPUT' && !['checkbox', 'date', 'radio'].includes(el.type);
  if ((kind === 'input') !== isText) return;
  BINDS[el.dataset.bind](el.type === 'checkbox' ? el.checked : el.value, el);
}
document.addEventListener('input', (e) => bindHandler(e, 'input'));
document.addEventListener('change', (e) => bindHandler(e, 'change'));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modalStack.length) closeModal(); });

/* ---------- Files ---------- */
function downloadFile(name, data, type) {
  const blob = data instanceof Blob ? data : new Blob([data], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener'; a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
function downloadPdf(name, bytes) { downloadFile(name, bytes, 'application/pdf'); toast('PDF downloaded: ' + name); }
// Opens the system file picker. Resolves with the chosen file, or null if the person cancels.
function pickFile(accept) {
  return new Promise((resolve) => {
    const inp = $('#filePicker');
    let settled = false;
    const done = (f) => {
      if (settled) return;
      settled = true;
      window.removeEventListener('focus', onFocus);
      resolve(f);
    };
    // Older browsers don't report a cancel, so also notice when the page gets focus back with nothing picked.
    const onFocus = () => setTimeout(() => { if (!(inp.files && inp.files[0])) done(null); }, 1200);
    inp.value = '';
    inp.accept = accept;
    inp.onchange = () => done(inp.files && inp.files[0] ? inp.files[0] : null);
    inp.oncancel = () => done(null);
    window.addEventListener('focus', onFocus);
    inp.click();
  });
}

function comingDue() {
  const td = today(), wk = addDays(td, 7);
  const overdue = DB.bills.filter((x) => billStatus(x, td) === 'Past Due');
  const odTotal = overdue.reduce((s, x) => s + toCents(x.amount), 0);
  const items = [];
  for (const x of DB.bills) {
    if (x.status !== 'Paid' && x.due_date >= td && x.due_date <= wk) items.push({ date: x.due_date, html: `<span class="pill info">Bill</span> ${esc(x.payee)}`, amt: -toCents(x.amount), act: btn('Pay', 'payBill', 'sm', { id: x.id }) });
  }
  const ready = [];
  for (const r of DB.recurring) {
    if (r.status !== 'Active' || recurringEnded(r) || !isDate(r.next_due_date) || r.next_due_date > wk) continue;
    const amt = (r.direction === 'In' ? 1 : -1) * toCents(r.amount);
    const late = r.next_due_date < td;
    if (!r.auto_post && r.next_due_date <= td) ready.push(r);
    items.push({ date: r.next_due_date, html: `<span class="pill">Recurring</span> ${esc(r.payee)} ${late ? '<span class="pill bad">Overdue</span>' : r.next_due_date === td ? '<span class="pill warn">Due today</span>' : ''} ${r.auto_post ? '<span class="pill ok">Auto</span>' : ''}`, amt, act: r.auto_post ? '' : btn('Post', 'postRec', 'sm', { id: r.id }) });
  }
  items.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  return `<div class="page-head"><h2>Coming due</h2><span class="muted small">Next 7 days</span></div>
    ${overdue.length ? `<button type="button" class="alert-row" data-act="goPastDue"><span>${plural(overdue.length, 'bill')} past due · ${fmt(odTotal)}</span><span>View →</span></button>` : ''}
    ${ready.length ? `<button type="button" class="alert-row info" data-tab="recurring"><span>${plural(ready.length, 'recurring entry', 'recurring entries')} ready to post</span><span>View →</span></button>` : ''}
    <div class="card">${items.length ? `<ul class="due-list">${items.map((i) => `<li><span class="when">${i.date === td ? 'Today' : fmtDate(i.date)}</span><span class="what">${i.html}</span><span class="${moneyCls(i.amt)}">${fmt(i.amt)}</span>${i.act}</li>`).join('')}</ul>` : '<p class="muted">Nothing due in the next 7 days.</p>'}</div>`;
}

  if (!DB.accounts.length) return pageHead('Register') + `<div class="card empty"><p class="muted">Add an account first.</p>${btn('+ Add account', 'newAccount', 'primary')}</div>`;
  const f = UI.reg;
  const filtered = f.cat || f.q || f.status || f.acct;
  return pageHead('Register', btn('+ Entry', 'newTxn', 'primary') + btn('+ Transfer', 'newTransfer')) +
    `<div class="toolbar">
      <label class="field">Account<select data-bind="regAcct"><option value="">All accounts</option>${acctOptions(f.acct, { includeInactive: true })}</select></label>
      <label class="field">Category<select data-bind="regCat">${catOptions(f.cat, { blank: 'All categories', extras: [['__none__', 'Uncategorized'], ['__transfer__', 'Transfers']] })}</select></label>
      <label class="field">Status<select data-bind="regStatus"><option value="">All</option><option value="cleared"${f.status === 'cleared' ? ' selected' : ''}>Cleared</option><option value="pending"${f.status === 'pending' ? ' selected' : ''}>Pending</option></select></label>
      <label class="field wide">Search<input type="search" data-bind="regQ" value="${esc(f.q)}" placeholder="Payee, memo, category, check #, amount"></label>
      <div class="btn-row wide">${btn('Clear filters', 'regClear', 'sm' + (filtered ? '' : ' hidden'))}

function regSummary() {
  const f = UI.reg;
  if (!f.acct) return '';
  const a = acctById(DB, f.acct), x = bal().byAcct.get(f.acct);
  if (!a || !x) return '';
  return `<div class="stats three">
    <div class="stat"><div class="label">${esc(a.name)} balance</div><div class="value ${moneyCls(x.run)}">${fmt(x.run)}</div></div>
    <div class="stat"><div class="label">Cleared</div><div class="value ${moneyCls(x.clr)}">${fmt(x.clr)}</div></div>
    <div class="stat"><div class="label">Pending</div><div class="value">${fmt(x.run - x.clr)}</div></div></div>`;

function txnTags(t) {
  let s = '';
  if (t.transfer_id) s += ' <span class="pill info">Transfer</span>';
  if (t.bill_id) s += ' <span class="pill">Bill</span>';
  if (t.auto_posted_on) s += ` <span class="pill ok" title="Posted automatically on ${esc(fmtDate(t.auto_posted_on))}">Auto-posted</span>`;
  return s;
}
// Renders register-style rows (used by Register and Reports).
function txnTable(rows, { showAcct = true, opening = null, footer = '' } = {}) {
  const b = bal();
  const head = `<thead><tr><th>Date</th>${showAcct ? '<th>Account</th>' : ''}<th>Payee / Memo</th><th>Category</th><th>Check #</th><th class="r">In</th><th class="r">Out</th><th>Status</th><th class="r">Balance</th><th class="r">Cleared bal.</th></tr></thead>`;
  const cols = showAcct ? 10 : 9;
  let body = '';
  if (opening) {
    body += `<tr class="opening"><td class="c-date">${esc(fmtDate(opening.date))}</td><td class="c-payee">Opening balance</td><td class="c-amt ${moneyCls(opening.c)}">${fmt(opening.c)}</td>
      <td class="c-cat"></td><td class="c-chk"></td><td class="c-in"></td><td class="c-out"></td><td class="c-status"></td><td class="c-bal r ${moneyCls(opening.c)}">${fmt(opening.c)}</td><td class="c-clr r ${moneyCls(opening.c)}">${fmt(opening.c)}</td></tr>`;
  }
  for (const t of rows) {
    const c = toCents(t.amount);
    const rb = b.row.get(t.id) || { run: 0, clr: 0 };
    const an = acctName(DB, t.account_id);
    const meta = [fmtDate(t.date), showAcct ? an : '', t.category, t.check_number ? '#' + t.check_number : ''].filter(Boolean).map(esc).join(' · ');
    body += `<tr data-act="editTxn" data-id="${esc(t.id)}">
      <td class="c-date num">${esc(fmtDate(t.date))}</td>
      ${showAcct ? `<td class="c-acct">${esc(an)}</td>` : ''}
      <td class="c-payee">${esc(t.payee || '(no payee)')}${txnTags(t)}${t.description ? `<div class="sub">${esc(t.description)}</div>` : ''}</td>
      <td class="c-amt ${c > 0 ? 'money in' : 'money'}">${c > 0 ? '+' + fmt(c) : fmt(c)}</td>
      <td class="c-meta">${meta}</td>
      <td class="c-cat">${esc(t.category)}</td>
      <td class="c-chk">${esc(t.check_number)}</td>
      <td class="c-in r money in">${c > 0 ? fmt(c) : ''}</td>
      <td class="c-out r money">${c < 0 ? fmt(-c) : ''}</td>
      <td class="c-status"><button type="button" class="pill ${t.cleared ? 'ok' : 'warn'}" data-act="toggleCleared" data-id="${esc(t.id)}" title="Tap to switch between Cleared and Pending">${t.cleared ? 'Cleared' : 'Pending'}</button></td>
      <td class="c-bal r ${moneyCls(rb.run)}">${fmt(rb.run)}<span class="clr-inline"> · cleared ${fmt(rb.clr)}</span></td>
      <td class="c-clr r ${moneyCls(rb.clr)}">${fmt(rb.clr)}</td></tr>`;
  }
  if (!rows.length && !opening) body = `<tr><td colspan="${cols}" class="muted" style="text-align:center;padding:24px">No entries match.</td></tr>`;
  return `<div class="table-wrap"><table class="tbl reg">${head}<tbody>${body}</tbody></table>${footer}</div>`;
}
function registerList() {
  const f = UI.reg;
  let rows = filterTxns(DB, { acct: f.acct, cat: f.cat, q: f.q, status: f.status });
  const totalCount = f.acct ? DB.transactions.filter((t) => t.account_id === f.acct).length : DB.transactions.length;
  let footer = '';
  let hiddenCount = 0;
  if (rows.length > f.limit) { hiddenCount = rows.length - f.limit; rows = rows.slice(rows.length - f.limit); }
  if (f.newest) rows = rows.slice().reverse();
  const a = f.acct ? acctById(DB, f.acct) : null;
  const opening = a && !hiddenCount && !f.cat && !f.q && !f.status && !f.newest ? { date: a.opening_date, c: toCents(a.opening_balance) } : null;
  if (hiddenCount) footer = `<div class="list-foot">${btn(`Show ${plural(hiddenCount, 'earlier entry', 'earlier entries')}`, 'regMore', 'sm')}</div>`;
  const shown = rows.length;
  return `<p class="muted small">Showing ${shown} of ${plural(totalCount, 'entry', 'entries')}. Balances on each row are the account's true running and cleared balances after that entry.</p>` + txnTable(rows, { showAcct: !f.acct, opening, footer });
}
function refreshRegList() {
  const l = $('#regList'); if (l) l.innerHTML = registerList();
  const c = document.querySelector('[data-act=regClear]');
  if (c) c.classList.toggle('hidden', !(UI.reg.cat || UI.reg.q || UI.reg.status || UI.reg.acct));
}
BINDS.regAcct = (v) => { UI.reg.acct = v; render(); };
BINDS.regCat = (v) => { UI.reg.cat = v; refreshRegList(); };
BINDS.regStatus = (v) => { UI.reg.status = v; refreshRegList(); };
BINDS.regQ = (v) => { UI.reg.q = v; refreshRegList(); };
BINDS.regNewest = (v) => { UI.reg.newest = v; refreshRegList(); };
ACTIONS.regClear = () => { UI.reg = { ...UI.reg, acct: '', cat: '', q: '', status: '' }; render(); };
ACTIONS.regMore = () => { UI.reg.limit += 1000; refreshRegList(); };
ACTIONS.toggleCleared = (d) => {
  const t = DB.transactions.find((x) => x.id === d.id);
  if (!t) return;
  t.cleared = !t.cleared;
  commit();
};
ACTIONS.newTxn = () => openTxnForm(null);
ACTIONS.editTxn = (d) => openTxnForm(d.id);

/* ---------- Entry form ---------- */
function openTxnForm(id) {
  const t = id ? DB.transactions.find((x) => x.id === id) : null;
  if (t && t.transfer_id) return openTransferForm(t.transfer_id);
  const dflAcct = UI.reg.acct && acctById(DB, UI.reg.acct)?.is_active ? UI.reg.acct : (DB.accounts.find((a) => a.is_active) || {}).id || '';
  const v = t || { date: today(), account_id: dflAcct, payee: '', description: '', category: '', check_number: '', amount: 0, cleared: false };
  const c = toCents(v.amount);
  const isIn = t ? c > 0 : false;
  const bill = t && t.bill_id ? DB.bills.find((b) => b.id === t.bill_id) : null;
  const rec = t && t.recurring_id ? DB.recurring.find((r) => r.id === t.recurring_id) : null;
  let history = '';
  if (t && t.auto_posted_on) history += `<div class="note">Posted automatically on ${esc(fmtDate(t.auto_posted_on))} by the auto-post check${rec ? ` (recurring: ${esc(rec.payee)})` : ''}. It is dated on its due date.</div>`;
  else if (rec) history += `<div class="note">Posted from the recurring entry "${esc(rec.payee)}".</div>`;
  if (bill) history += `<div class="note">This entry pays the bill "${esc(bill.payee)}". Deleting it marks that bill Unpaid again.</div>`;
  formModal({
    title: t ? 'Edit entry' : 'New entry',
    fields: `${history}<div class="form-grid two" style="margin-top:${history ? 12 : 0}px">
      <div class="field span2"><span>Money</span><div class="seg" role="radiogroup" aria-label="Money in or out">
        <label><input type="radio" name="dir" value="out"${isIn ? '' : ' checked'}><span>Money out</span></label>
        <label><input type="radio" name="dir" value="in"${isIn ? ' checked' : ''}><span>Money in</span></label></div></div>
      <label class="field">Amount<input name="amount" inputmode="decimal" value="${t ? fixed2(Math.abs(c)) : ''}" placeholder="0.00"></label>
      <label class="field">Date<input type="date" name="date" value="${esc(v.date)}"></label>
      <label class="field">Account<select name="account_id">${acctOptions(v.account_id, { blank: DB.accounts.length > 1 ? 'Choose…' : '' })}</select></label>
      <label class="field">Payee<input name="payee" list="payeeList" value="${esc(v.payee)}" maxlength="120"></label>
      <label class="field">Category<select name="category">${catOptions(v.category)}</select></label>
      <label class="field">Check #<input name="check_number" inputmode="numeric" value="${esc(v.check_number)}" maxlength="20"></label>
      <label class="field span2">Description / memo<input name="description" value="${esc(v.description)}" maxlength="200"></label>
      <label class="toggle span2"><input type="checkbox" name="cleared"${v.cleared ? ' checked' : ''}> Cleared (off = Pending)</label>
    </div>${payeeDatalist()}`,
    extraButtons: t ? `<button type="button" class="btn danger-ghost" data-x="del">Delete</button>` : '',
    onSubmit(form) {
      const amt = amountField(form, 'amount', 'Amount');
      if (amt.error) return amt.error;
      if (!fv(form, 'date')) return 'Date: enter the date of the entry.';
      if (!fv(form, 'account_id')) return 'Account: choose an account.';
      const res = saveTxn(DB, { id, date: fv(form, 'date'), account_id: fv(form, 'account_id'), payee: fv(form, 'payee'), description: fv(form, 'description'), category: fv(form, 'category'), check_number: fv(form, 'check_number'), amountC: radioVal(form, 'dir') === 'in' ? amt.c : -amt.c, cleared: fv(form, 'cleared') });
      if (res.error) return res.error;
      if (bill && bill.linked_transaction_id === res.txn.id && res.txn.date !== bill.paid_date) bill.paid_date = res.txn.date;
      commit(t ? 'Entry saved' : 'Entry added');
    },
    after(form, m) {
      const payee = form.elements.payee;
      if (!t) payee.addEventListener('change', () => {
        if (!form.elements.category.value) { const c2 = lastCategoryForPayee(DB, payee.value); if (c2) form.elements.category.value = c2; }
      });
      const del = m.querySelector('[data-x=del]');
      if (del) del.onclick = async () => {
        if (await confirmBox({ title: 'Delete entry?', body: `Delete <b>${esc(t.payee || 'this entry')}</b> for ${fmt(Math.abs(c))} on ${esc(fmtDate(t.date))}?${bill ? ' The bill it paid will be marked Unpaid.' : ''}`, ok: 'Delete', danger: true })) {
          deleteTxn(DB, id); closeModal(m, true); commit('Entry deleted');
        }
      };
    },
  });
}

VIEWS.transfers = function () {
  const head = pageHead('Transfers', DB.accounts.length > 1 ? btn('+ Transfer', 'newTransfer', 'primary') : '');
  if (DB.accounts.length < 2) return head + `<div class="card empty"><p class="muted">Transfers move money between two of your accounts. Add at least two accounts first.</p>${btn('+ Add account', 'newAccount', 'primary')}</div>`;
  const list = [...DB.transfers].sort((a, b) => (a.date > b.date ? -1 : a.date < b.date ? 1 : a.id < b.id ? 1 : -1));
  if (!list.length) return head + `<div class="card empty"><p class="muted">No transfers yet. A transfer creates two linked register entries: money out of one account and the same amount into another.</p>${btn('+ New transfer', 'newTransfer', 'primary')}</div>`;
  return head + `<div class="rows">${list.map((x) => {
    const s = transferSides(DB, x.id);
    const ok = s.from && s.to;
    return `<div class="row-item"><div><div class="title">${esc(acctName(DB, x.from_account_id))} → ${esc(acctName(DB, x.to_account_id))}</div>
      <div class="meta">${esc(fmtDate(x.date))}${x.description ? ' · ' + esc(x.description) : ''}</div>
      <div class="pills">${ok ? `<span class="pill ${s.from.cleared ? 'ok' : 'warn'}">${s.from.cleared ? 'Cleared' : 'Pending'}</span>` : '<span class="pill bad">Needs repair — open and save</span>'}</div></div>
      <div class="amount">${fmt(toCents(x.amount))}</div>
      <div class="row-actions">${btn('Edit', 'editTransfer', 'sm', { id: x.id })}${btn('Delete', 'delTransfer', 'sm danger-ghost', { id: x.id })}</div></div>`;
  }).join('')}</div>`;
};
ACTIONS.newTransfer = () => {
  if (DB.accounts.filter((a) => a.is_active).length < 2) { toast('Add a second account first — a transfer needs two accounts.', true); return; }
  openTransferForm(null);
};
ACTIONS.editTransfer = (d) => openTransferForm(d.id);
ACTIONS.delTransfer = async (d) => {
  const x = DB.transfers.find((t) => t.id === d.id);
  if (!x) return;
  if (await confirmBox({ title: 'Delete transfer?', body: `Delete the ${fmt(toCents(x.amount))} transfer from <b>${esc(acctName(DB, x.from_account_id))}</b> to <b>${esc(acctName(DB, x.to_account_id))}</b>? Both register entries are removed.`, ok: 'Delete', danger: true })) {
    deleteTransfer(DB, x.id); commit('Transfer deleted');
  }
};
function openTransferForm(id) {
  const x = id ? DB.transfers.find((t) => t.id === id) : null;
  const sides = x ? transferSides(DB, x.id) : null;
  const act = DB.accounts.filter((a) => a.is_active);
  const v = x || { date: today(), from_account_id: UI.reg.acct || act[0]?.id || '', to_account_id: '', amount: 0, description: '' };
  if (!x && (!v.to_account_id || v.to_account_id === v.from_account_id)) v.to_account_id = (act.find((a) => a.id !== v.from_account_id) || {}).id || '';
  const cleared = sides && sides.from ? sides.from.cleared : false;
  formModal({
    title: x ? 'Edit transfer' : 'New transfer',
    fields: `<div class="form-grid two">
      <div class="swap-row span2">
        <label class="field">From account<select name="from">${acctOptions(v.from_account_id, { blank: 'Choose…' })}</select></label>
        <button type="button" class="icon-btn" data-x="swap" aria-label="Swap From and To" title="Swap From and To">⇄</button>
        <label class="field">To account<select name="to">${acctOptions(v.to_account_id, { blank: 'Choose…' })}</select></label>
      </div>
      <label class="field">Amount<input name="amount" inputmode="decimal" value="${x ? fixed2(toCents(x.amount)) : ''}" placeholder="0.00"></label>
      <label class="field">Date<input type="date" name="date" value="${esc(v.date)}"></label>
      <label class="field span2">Description<input name="description" value="${esc(v.description)}" maxlength="200"></label>
      <label class="toggle span2"><input type="checkbox" name="cleared"${cleared ? ' checked' : ''}> Cleared (applies to both sides)</label></div>
      <p class="muted small">Saving updates both linked register entries together: money out of From, the same amount into To.</p>`,
    extraButtons: x ? `<button type="button" class="btn danger-ghost" data-x="del">Delete</button>` : '',
    onSubmit(form) {
      const amt = amountField(form, 'amount', 'Amount');
      if (amt.error) return amt.error;
      if (!fv(form, 'from')) return 'From account: choose the account the money leaves.';
      if (!fv(form, 'to')) return 'To account: choose the account the money arrives in.';
      const res = saveTransfer(DB, { id, date: fv(form, 'date'), from_account_id: fv(form, 'from'), to_account_id: fv(form, 'to'), amountC: amt.c, description: fv(form, 'description'), cleared: fv(form, 'cleared') });
      if (res.error) return res.error;
      commit(x ? 'Transfer saved' : 'Transfer added');
    },
    after(form, m) {
      m.querySelector('[data-x=swap]').onclick = () => { const a = form.elements.from.value; form.elements.from.value = form.elements.to.value; form.elements.to.value = a; };
      const del = m.querySelector('[data-x=del]');
      if (del) del.onclick = async () => { closeModal(m, true); await ACTIONS.delTransfer({ id }); };
    },
  });
}

// ---- ui2.js ----
'use strict';
/* ===== UI: Categories, Recurring, Bills, Reports, Sync / Settings, PDFs, startup ===== */

/* =====================================================================
   CATEGORIES
   ===================================================================== */
function summaryTable(sum, emptyText) {
  if (!sum.rows.length) return `<div class="card"><p class="muted">${esc(emptyText)}</p></div>`;
  return `<div class="table-wrap"><table class="tbl"><thead><tr><th>Category</th><th class="r">Money in</th><th class="r">Money out</th><th class="r">Net</th><th class="r">Count</th></tr></thead><tbody>
    ${sum.rows.map((r) => `<tr class="${r.depth ? 'child' : 'parent'}"><td>${esc(r.depth ? r.name : r.name)}</td><td class="r money in">${r.inC ? fmt(r.inC) : ''}</td><td class="r money">${r.outC ? fmt(r.outC) : ''}</td><td class="r ${moneyCls(r.net)}">${fmt(r.net)}</td><td class="r num">${r.count}</td></tr>`).join('')}
    <tr class="total"><td>Total (transfers not included)</td><td class="r money">${fmt(sum.totals.inC)}</td><td class="r money">${fmt(sum.totals.outC)}</td><td class="r ${moneyCls(sum.totals.net)}">${fmt(sum.totals.net)}</td><td class="r num">${sum.totals.count}</td></tr>
    </tbody></table></div><p class="muted small">Parent totals include their subcategories.</p>`;
}
function catSummaryScope() {
  if (UI.cats.mode === 'all') return { label: 'All time', txns: DB.transactions };
  const m = UI.cats.month;
  return { label: fmtMonth(m), txns: DB.transactions.filter((t) => t.date.slice(0, 7) === m) };
}
VIEWS.categories = function () {
  const tree = catTree(DB);
  const head = pageHead('Categories', btn('+ Category', 'newCat', 'primary') + (tree.length ? btn('Download categories PDF', 'pdfCats') : ''));
  const list = tree.length ? `<div class="rows">${tree.map(({ cat, path, depth, orphan }) => {
    const used = categoryUsage(DB, path);
    return `<div class="row-item${depth ? ' child' : ''}"><div><div class="title">${esc(depth ? cat.name : cat.name)}${orphan ? ' <span class="pill bad">parent missing</span>' : ''}</div>
      <div class="meta">${esc(cat.kind)}${used ? ' · used ' + plural(used, 'time') : ''}${depth ? ' · ' + esc(path) : ''}</div></div><div></div>
      <div class="row-actions">${!depth ? btn('+ Subcategory', 'newSubCat', 'sm', { id: cat.id }) : ''}${btn('Edit', 'editCat', 'sm', { id: cat.id })}${btn('Delete', 'delCat', 'sm danger-ghost', { id: cat.id })}</div></div>`;
  }).join('')}</div>` : `<div class="card empty"><p class="muted">No categories yet. Add top-level categories like "Food", then subcategories like "Food > Groceries".</p>${btn('+ Add category', 'newCat', 'primary')}</div>`;
  const months = new Set([today().slice(0, 7), UI.cats.month]);
  for (const t of DB.transactions) if (isDate(t.date)) months.add(t.date.slice(0, 7));
  const scope = catSummaryScope();
  const sum = categorySummary(DB, scope.txns);
  return head + list + `<section class="section"><div class="page-head"><h2>Category summary</h2><div class="actions">${btn('Summary PDF', 'pdfCatSummary', 'sm')}</div></div>
    <div class="btn-row" style="margin-bottom:12px;align-items:end">
      <div class="seg" role="radiogroup" aria-label="Summary period">
        <label><input type="radio" name="catmode" value="month" data-bind="catMode"${UI.cats.mode === 'month' ? ' checked' : ''}><span>Month</span></label>
        <label><input type="radio" name="catmode" value="all" data-bind="catMode"${UI.cats.mode === 'all' ? ' checked' : ''}><span>All time</span></label></div>
      ${UI.cats.mode === 'month' ? `<label class="field" style="min-width:190px">Month<select data-bind="catMonth">${[...months].sort().reverse().map((m) => `<option value="${m}"${m === UI.cats.month ? ' selected' : ''}>${fmtMonth(m)}</option>`).join('')}</select></label>` : ''}
    </div>${summaryTable(sum, `No entries in ${scope.label}.`)}</section>`;
};
BINDS.catMode = (v) => { UI.cats.mode = v; render(); };
BINDS.catMonth = (v) => { UI.cats.month = v; render(); };
ACTIONS.newCat = () => openCatForm(null, '');
ACTIONS.newSubCat = (d) => openCatForm(null, (DB.categories.find((c) => c.id === d.id) || {}).name || '');
ACTIONS.editCat = (d) => openCatForm(d.id);

ACTIONS.delCat = (d) => {

VIEWS.recurring = function () {
  const head = pageHead('Recurring', btn('+ Recurring', 'newRec', 'primary') + btn('Run auto-post check now', 'autoCheck') + (DB.recurring.length ? btn('PDF', 'pdfRec') : ''));
  const note = `<div class="note" style="margin-bottom:12px">Auto-post runs when you open Dinero (and every hour while it stays open). Nothing posts while the app is closed — an entry set to post early appears the first time you open the app on or after that day, still dated on its due date.</div>`;
  if (!DB.accounts.length) return head + `<div class="card empty"><p class="muted">Add an account first.</p></div>`;
  if (!DB.recurring.length) return head + note + `<div class="card empty"><p class="muted">No recurring entries yet — add paychecks, rent, subscriptions, and other repeating money in or out.</p>${btn('+ Add recurring entry', 'newRec', 'primary')}</div>`;
  const td = today();
  const list = [...DB.recurring].sort((a, b) => (recurringEnded(a) - recurringEnded(b)) || (a.next_due_date < b.next_due_date ? -1 : a.next_due_date > b.next_due_date ? 1 : 0));
  return head + note + `<div class="rows">${list.map((r) => {
    const ended = recurringEnded(r);
    const active = r.status === 'Active' && !ended;
    const due = r.next_due_date;
    const isToday = active && due === td, late = active && due < td;
    const pills = [];
    if (ended) pills.push('<span class="pill">Ended</span>');
    else if (r.status === 'Paused') pills.push('<span class="pill">Paused</span>');
    if (late) pills.push('<span class="pill bad">Overdue</span>');
    if (isToday) pills.push('<span class="pill warn">Due today</span>');
    if (r.auto_post && !ended) pills.push(`<span class="pill ok">Auto-posts ${r.days_in_advance ? plural(r.days_in_advance, 'day') + ' early' : 'on the due date'} · on ${esc(fmtDate(autoPostDate(r)))}</span>`);
    const c = (r.direction === 'In' ? 1 : -1) * toCents(r.amount);
    return `<div class="row-item${late ? ' past-due' : isToday ? ' due-today' : ''}"><div><div class="title">${esc(r.payee)}</div>
      <div class="meta">${esc(r.frequency)} · ${esc(acctName(DB, r.account_id))}${r.category ? ' · ' + esc(r.category) : ''}</div>
      <div class="meta">${ended ? 'Ended ' + esc(fmtDate(r.end_date)) : 'Next due ' + esc(fmtDate(due))}${r.end_date && !ended ? ' · ends ' + esc(fmtDate(r.end_date)) : ''}</div>
      <div class="pills">${pills.join('')}</div></div>
      <div class="amount ${c > 0 ? 'in' : ''}">${c > 0 ? '+' : ''}${fmt(c)}</div>
      <div class="row-actions">${active ? btn('Post', 'postRec', 'sm primary', { id: r.id }) + btn('Skip', 'skipRec', 'sm', { id: r.id }) : ''}
        ${!ended ? btn(r.status === 'Paused' ? 'Resume' : 'Pause', 'pauseRec', 'sm', { id: r.id }) : ''}${btn('Edit', 'editRec', 'sm', { id: r.id })}${btn('Delete', 'delRec', 'sm danger-ghost', { id: r.id })}</div></div>`;
  }).join('')}</div>`;
};

/* ---------- The Dinero file: open at launch, save when done ---------- */
function dataFileName() {
  const d = new Date();
  return `Dinero ${localDateStr(d)} ${pad(d.getHours())}.${pad(d.getMinutes())}.json`;
}
const isStandalone = () => !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));
// Saves everything to a new file named with the date and time. Returns true when it was handed to the device.
async function saveDataFile() {
  const name = dataFileName();
  const json = JSON.stringify(makeBackup(DB), null, 1);
  let file = null;
  try { file = new File([json], name, { type: 'application/json' }); } catch (e) { file = null; }
  // The iPhone Home Screen app can't download directly, so it uses the share sheet (Save to Files).
  if (file && isStandalone() && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); }
    catch (e) { if (e && e.name === 'AbortError') { toast('Not saved. Tap Save again when you are ready.'); return false; } downloadFile(name, json, 'application/json'); }
  } else {
    downloadFile(name, json, 'application/json');
  }
  DEV.dirty = false;
  DEV.lastExported = new Date().toISOString();
  DEV.fileName = name;
  save(); render();
  toast(`Saved "${name}"`);
  return true;
}
// Lets the person pick a Dinero file and loads it. Returns true when a file was opened.
async function openDataFile() {
  const file = await pickFile('.json,application/json');
  if (!file) return false;
  let parsed;
  try { parsed = parseBackup(await file.text()); } catch (e) { toast(e.message, true); return false; }
  if (DEV.dirty && hasData()) {
    const ok = await confirmBox({
      title: 'Replace unsaved changes?', ok: 'Open file anyway', danger: true,
      body: `<p>This device has changes from ${esc(fmtDateTime(DEV.lastChanged))} that aren't saved in a Dinero file yet.</p><p>Opening <b>${esc(file.name)}</b>${parsed.exported_at ? ` (saved ${esc(fmtDateTime(parsed.exported_at))})` : ''} replaces them.</p>`,
    });
    if (!ok) return false;
  }
  DB = parsed.db;
  BAL = null;
  DEV.dirty = false;
  DEV.lastImported = new Date().toISOString();
  DEV.fileName = file.name;
  UI.reg.acct = ''; UI.check = null;
  save();
  render();
  toast(`Opened "${file.name}"`);
  return true;
}

   ===================================================================== */
function autoPostCheck(manual) {
  const posted = runAutoPost(DB, today());
  DEV.lastAutoCheck = new Date().toISOString();
  if (posted.length) {
    commit(`Auto-posted ${plural(posted.length, 'recurring entry', 'recurring entries')}`);
  } else {
    save();
    if (manual) { render(); toast('Auto-post check done — nothing is due to post right now.'); }
  }
  return posted;
}
/* ---------- Launch screen + opening animation ----------
   On open, the logo pops in big in the middle of the screen (the $ tile flips in like a coin, the letters rise)
   and three choices appear: open your Dinero file, continue on this device, or start a new file.
   After a choice, the logo swoops up into the top-left corner while the cover fades, then the tabs and the page
   slide into place. With Reduce Motion turned on, the same screen appears without movement. */
function showLaunch() {
  const brand = $('.topbar .brand');
  const reduce = !brand || !brand.animate || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  document.body.classList.add('intro');
  const r = brand.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight;
  const veil = document.createElement('div');
  veil.className = 'intro-veil';
  const fly = brand.cloneNode(true);
  fly.classList.add('intro-fly');
  fly.setAttribute('aria-hidden', 'true');
  Object.assign(fly.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
  const nameEl = fly.querySelector('.brand-name');
  const letters = [...nameEl.textContent].map((ch) => { const s = document.createElement('span'); s.textContent = ch; return s; });
  nameEl.textContent = '';
  letters.forEach((s) => nameEl.appendChild(s));

  const scale = Math.max(1.6, Math.min(3, (vw * 0.62) / r.width));
  const cy = Math.min(vh * 0.34, 260); // where the big logo sits
  const dx = vw / 2 - (r.left + r.width / 2), dy = cy - (r.top + r.height / 2);
  const at = (x, y, s) => `translate(${x}px, ${y}px) scale(${s})`;
  const big = at(dx, dy, scale);

  const local = hasData();
  const sub = !local ? '' : DEV.dirty
    ? `<span class="gate-warn">Has changes not saved to a file yet</span>`
    : `Up to date with ${DEV.fileName ? esc(DEV.fileName) : 'your last saved file'}`;
  const gate = document.createElement('div');
  gate.className = 'intro-gate';
  gate.style.top = (cy + (r.height * scale) / 2 + 26) + 'px';
  gate.innerHTML = `<p class="gate-tag">Your personal check register</p>
    <button type="button" class="btn primary gate-btn" data-g="open">Open my Dinero file</button>
    ${local ? `<button type="button" class="btn gate-btn" data-g="continue"><span>Continue on this device</span><small>${sub}</small></button>` : ''}
    <button type="button" class="btn ghost gate-btn" data-g="new">Start a new file</button>
    <p class="gate-note">Your Dinero file is in iCloud Drive. On iPhone, look in <b>Downloads</b> and pick the newest one.</p>`;
  veil.appendChild(gate);
  document.body.append(veil, fly);
  fly.style.transform = big;

  const anims = [];
  if (!reduce) {
    anims.push(fly.animate([
      { transform: at(dx, dy + 30, scale * 0.7), opacity: 0, easing: 'cubic-bezier(.2,.9,.3,1.3)' },
      { transform: big, opacity: 1 },
    ], { duration: 520, fill: 'both' }));
    anims.push(fly.querySelector('.logo').animate([
      { transform: 'rotateY(-180deg) scale(.4)' }, { transform: 'rotateY(12deg) scale(1.08)', offset: 0.7 }, { transform: 'none' },
    ], { duration: 640, easing: 'ease-out', fill: 'both' }));
    letters.forEach((s, i) => anims.push(s.animate([
      { transform: 'translateY(.6em)', opacity: 0 }, { transform: 'none', opacity: 1 },
    ], { duration: 380, delay: 180 + i * 55, easing: 'cubic-bezier(.2,.8,.2,1.15)', fill: 'both' })));
    [...gate.children].forEach((el, i) => el.animate([
      { transform: 'translateY(14px)', opacity: 0 }, { transform: 'none', opacity: 1 },
    ], { duration: 420, delay: 560 + i * 80, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' }));
  }

  let busy = false, gone = false;
  const exit = () => {
    if (gone) return;
    gone = true;
    autoPostCheck(false);
    render();
    const finish = () => { revealPage(); fly.remove(); veil.remove(); document.body.classList.remove('intro'); };
    if (reduce) return finish();
    anims.forEach((a) => a.cancel());
    const T = 950;
    gate.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(10px)' }], { duration: 220, fill: 'forwards' });
    const swoop = fly.animate([
      { transform: big, offset: 0, easing: 'cubic-bezier(.55,0,.4,1)' },
      { transform: at(dx * 0.62, dy * 0.18, 1 + (scale - 1) * 0.45), offset: 0.5, easing: 'cubic-bezier(.2,.7,.25,1.08)' },
      { transform: 'none', offset: 1 },
    ], { duration: T, fill: 'both' });
    fly.querySelector('.logo').animate([
      { transform: 'none' }, { transform: 'rotateY(360deg)', offset: 0.85 }, { transform: 'rotateY(360deg)' },
    ], { duration: T, easing: 'cubic-bezier(.45,0,.2,1)', fill: 'both' });
    veil.animate([{ opacity: 1 }, { opacity: 1, offset: 0.15 }, { opacity: 0 }], { duration: T, easing: 'ease-in', fill: 'both' });
    let done = false;
    const once = () => { if (!done) { done = true; finish(); } };
    swoop.finished.then(once, once);
    setTimeout(once, T + 4000); // safety net in case the browser never reports the end
  };
  gate.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-g]');
    if (!b || busy || gone) return;
    busy = true;
    try {
      const g = b.dataset.g;
      if (g === 'open') { if (await openDataFile()) exit(); }
      else if (g === 'continue') exit();
      else if (g === 'new') {
        const ok = !hasData() || await confirmBox({
          title: 'Start a new file?', ok: 'Start new', danger: true,
          body: `<p>This clears the working copy on this device so you can start an empty register.</p><p>Dinero files you saved in iCloud Drive are <b>not</b> touched.</p>${DEV.dirty ? '<div class="note warn">This device has changes that are not saved in a file. They will be lost.</div>' : ''}`,
        });
        if (ok) {
          DB = emptyDb(); BAL = null;
          DEV.dirty = false; DEV.fileName = ''; DEV.lastChanged = new Date().toISOString();
          UI.reg.acct = ''; UI.check = null; UI.tab = 'dashboard';
          save();
          exit();
        }
      }
    } finally { busy = false; }
  });
}
// Tabs slide in from the left, then the page's blocks rise into place one after another.
function revealPage() {
  const tabs = [...document.querySelectorAll('#tabs button')];
  tabs.forEach((b, i) => b.animate([
    { transform: 'translateX(-14px)', opacity: 0 }, { transform: 'none', opacity: 1 },
  ], { duration: 380, delay: i * 40, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' }));
  const blocks = [];
  for (const el of $('#main').children) {
    if (el.matches('.grid, .stats, .settings-grid')) blocks.push(...el.children);
    else blocks.push(el);
  }
  blocks.slice(0, 14).forEach((el, i) => el.animate([
    { transform: 'translateY(18px) scale(.985)', opacity: 0 }, { transform: 'none', opacity: 1 },
  ], { duration: 520, delay: 120 + i * 70, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' }));
}

async function init() {
  const engine = await Storage.init();
  if (engine === 'none') showBanner('This browser is blocking storage (for example a private window), so nothing you enter will be kept. Open Dinero in a normal Safari or Chrome window.');
  const data = await Storage.get('data');
  if (data) DB = normalizeDb(data);
  const dev = await Storage.get('device');
  if (dev) {
    // Devices set up before the Save button existed: treat changes after the last backup as unsaved.
    if (dev.dirty === undefined) dev.dirty = !!(dev.lastChanged && (!dev.lastExported || dev.lastChanged > dev.lastExported));
    Object.assign(DEV, dev);
  }
  render();
  showLaunch();
  setInterval(() => autoPostCheck(false), 60 * 60 * 1000);
  let lastDay = today();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    const posted = autoPostCheck(false);
    if (!posted.length && today() !== lastDay) render();
    lastDay = today();
  });
}
init();

// Offline support when Dinero is served from a web address (Home Screen app). Opening the file directly skips this.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* offline cache is optional */ }); });
}

</script>
